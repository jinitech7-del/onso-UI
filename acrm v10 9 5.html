function mobCustomers(){
  var vipCnt=CUSTOMERS.filter(function(c){return c.grade==='VIP';}).length;
  var urgCnt=CUSTOMERS.filter(function(c){return c.dday&&c.dday<=7;}).length;

  // ── 통계 카드 (클릭 → 필터) ──
  var statArr=[
    {l:'전체', v:CUSTOMERS.length+'사', c:'var(--ac)',    f:'전체'},
    {l:'VIP',  v:vipCnt+'사',          c:'var(--yellow)', f:'VIP'},
    {l:'긴급',    v:urgCnt+'건',           c:'var(--red)',    f:'긴급'},
    {l:'프로젝트', v:'18건',              c:'var(--green)',  f:'전체'},
  ];
  var stats='';
  for(var si=0;si<statArr.length;si++){
    var ss=statArr[si];
    var isOn=mobCustStatFilter===ss.f;
    stats+='<div class="mob-stat-card" onclick="setMobCustStatFilter(\''+ss.f+'\')" style="border-top-color:'+ss.c+';cursor:pointer;'+(isOn?'background:var(--bg-hover);box-shadow:0 0 0 1.5px '+ss.c+'40':'')+'">'
          +'<div class="mob-stat-lbl">'+ss.l+'</div>'
          +'<div class="mob-stat-val" style="color:'+ss.c+'">'+ss.v+'</div>'
          +'</div>';
  }

  // ── 유형 칩 필터 (4개) ──
  var typeArr=['기관','기업','교육','병원'];
  var chips='';
  for(var ci=0;ci<typeArr.length;ci++){
    var cf=typeArr[ci];
    var con=mobCustTypeFilter===cf;
    chips+='<button class="mob-chip'+(con?' on':'')+'" onclick="setMobCustTypeFilter(\''+cf+'\')">'+cf+'</button>';
  }

  // ── 필터링 ──
  var filtered=CUSTOMERS.filter(function(c){
    // 통계칩 필터
    if(mobCustStatFilter==='VIP' && c.grade!=='VIP') return false;
    if(mobCustStatFilter==='긴급' && !(c.dday&&c.dday<=7)) return false;
    // 유형 칩 필터
    if(mobCustTypeFilter==='기관' && c.type!=='기관') return false;
    if(mobCustTypeFilter==='기업' && c.type!=='기업') return false;
    if(mobCustTypeFilter==='교육' && c.type!=='교육기관') return false;
    if(mobCustTypeFilter==='병원' && c.type!=='병원') return false;
    // 검색
    if(mobCustSearch){
      var q=mobCustSearch.toLowerCase();
      if(c.name.toLowerCase().indexOf(q)<0 && (c.biz||'').indexOf(q)<0) return false;
    }
    return true;
  });

  // ── 카드 목록 ──
  var cards='';
  for(var ri=0;ri<filtered.length;ri++){
    var c=filtered[ri];
    var gc=GRADE_COLOR[c.grade]||'var(--txm)';
    var dc=ddayColor(c.dday);
    var ddBadge=c.dday?('<span class="cust-dday" style="background:'+dc+'22;color:'+dc+'">D-'+c.dday+'</span>'):'';
    var tagHtml='';
    for(var ti=0;ti<Math.min(c.tags.length,2);ti++){tagHtml+='<span class="cust-tag">'+c.tags[ti]+'</span>';}
    cards+='<div class="mob-cust-card" style="border-left-color:'+gc+'" onclick="setMobCustSel('+c.id+')">';
    cards+='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px">';
    cards+='<div><div style="font-size:12px;font-weight:600;color:var(--tx)">'+c.name+'</div>';
    cards+='<div style="display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap">'+mgmtSpan(c.mgmt)+'<span class="cust-tag">'+c.type+'</span><span class="cust-tag">'+c.region+'</span></div></div>';
    cards+=ddBadge+'</div>';
    cards+='<div style="display:flex;align-items:center;gap:6px;margin-top:4px">';
    cards+=gradeSpan(c.grade);
    cards+='<span style="font-size:10px;color:var(--txm)">담당: '+c.owner+'</span>';
    cards+='<span style="font-size:10px;color:var(--ac);margin-left:auto">프로젝트 '+c.projects+'건</span>';
    cards+='</div>';
    if(tagHtml) cards+='<div style="margin-top:5px">'+tagHtml+'</div>';
    cards+='</div>';
  }
  if(!filtered.length){
    cards='<div style="text-align:center;padding:40px 0;color:var(--txm);font-size:12px">검색 결과가 없습니다</div>';
  }


  return '<div class="mob-stat-row">'+stats+'</div>'
        +'<div style="display:flex;align-items:center;gap:8px;padding:6px 0">'
        +'<div style="display:flex;align-items:center;gap:6px;background:var(--bg-surf);border:1px solid var(--bd-def);border-radius:8px;padding:6px 10px;flex:1;min-width:0">'+I('search',13,'var(--txm)')
        +'<input id="custSearchInput" placeholder="고객명 검색..." value="'+mobCustSearch+'" oninput="setMobCustSearch(this.value)" oncompositionstart="_custSearchComposing=true" oncompositionend="_custSearchComposing=false;setMobCustSearch(this.value)" style="background:none;border:none;outline:none;font-size:16px;color:var(--tx);width:100%;font-family:inherit"/>'
        +(mobCustSearch?'<button onclick="setMobCustSearch(\'\')" style="background:none;border:none;color:var(--txm);cursor:pointer;font-size:14px;padding:0;flex-shrink:0">&times;</button>':'')
        +'</div>'
        +'<button onclick="showPP(\'narajangteo\')" style="flex-shrink:0;padding:5px 10px;border-radius:7px;background:var(--ac);color:#fff;border:none;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;min-width:80px;text-align:center">'+I('search',10,'#fff')+' 신규 고객사</button>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:4px;padding:0 0 8px">'+chips
        +'<button onclick="showPP(\'cust-new\')" style="margin-left:auto;flex-shrink:0;padding:5px 10px;border-radius:7px;background:var(--ac);color:#fff;border:none;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;min-width:80px;text-align:center">+ 신규 등록</button>'
        +'</div>'
        +'<div id="mob-cust-list" class="mob-card-list">'+cards+'</div>';
}

function renderMobCustCards(){
  var filtered=CUSTOMERS.filter(function(c){
    if(mobCustStatFilter==='VIP') return c.grade==='VIP';
    if(mobCustStatFilter==='긴급') return c.dday&&c.dday<=7;
    if(mobCustStatFilter==='프로젝트') return c.projects>0;
    if(mobCustTypeFilter!=='전체') return c.type===mobCustTypeFilter;
    return true;
  }).filter(function(c){
    if(!mobCustSearch) return true;
    var q=mobCustSearch.toLowerCase();
    return c.name.toLowerCase().indexOf(q)>=0||(c.biz||'').indexOf(q)>=0;
  });
  if(!filtered.length) return '<div style="text-align:center;padding:40px 0;color:var(--txm);font-size:12px">검색 결과가 없습니다</div>';
  var cards='';
  for(var ri=0;ri<filtered.length;ri++){
    var c=filtered[ri];
    var gc=GRADE_COLOR[c.grade]||'var(--txm)';
    var dc=ddayColor(c.dday);
    var ddBadge=c.dday?('<span class="cust-dday" style="background:'+dc+'22;color:'+dc+'">D-'+c.dday+'</span>'):'';
    var tagHtml='';
    for(var ti=0;ti<Math.min(c.tags.length,2);ti++){tagHtml+='<span class="cust-tag">'+c.tags[ti]+'</span>';}
    cards+='<div class="mob-cust-card" style="border-left-color:'+gc+'" onclick="setMobCustSel('+c.id+')">';
    cards+='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px">';
    cards+='<div><div style="font-size:12px;font-weight:600;color:var(--tx)">'+c.name+'</div>';
    cards+='<div style="display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap">'+mgmtSpan(c.mgmt)+'<span class="cust-tag">'+c.type+'</span><span class="cust-tag">'+c.region+'</span></div></div>';
    cards+=ddBadge+'</div>';
    cards+='<div style="display:flex;align-items:center;gap:6px;margin-top:4px">';
    cards+=gradeSpan(c.grade);
    cards+='<span style="font-size:10px;color:var(--txm)">담당: '+c.owner+'</span>';
    cards+='<span style="font-size:10px;color:var(--ac);margin-left:auto">프로젝트 '+c.projects+'건</span>';
    cards+='</div>';
    if(tagHtml) cards+='<div style="margin-top:5px">'+tagHtml+'</div>';
    cards+='</div>';
  }
  return cards;
}

function setMobCustSearch(v){
  mobCustSearch=v;

  clearTimeout(_custSearchTimer);

    // ── 전체 레이아웃 ──

function mobScreenView(){
  var id=mobScreen;

  // ── 공통 헤더 빌더
  function screenHeader(title, sub){
    return '<div style="background:var(--bg-surf);border-bottom:1px solid var(--bd-sub);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0">'
      +'<button onclick="closeMobScreen()" style="background:none;border:none;cursor:pointer;padding:2px">'+I('arrowL',20,'var(--ac)')+'</button>'
      +'<div style="flex:1">'
      +'<div style="font-size:14px;font-weight:700;color:var(--tx)">'+title+'</div>'
      +(sub?'<div style="font-size:10px;color:var(--txm);margin-top:1px">'+sub+'</div>':'')
      +'</div>'
      +'</div>';
  }
  // ── 공통 레이아웃
  function screenWrap(header, body, footer){
    return '<div class="mob-cust-detail">'
      +header
      +'<div style="flex:1;overflow-y:auto;padding:12px 14px 20px">'+body+'</div>'
      +(footer?'<div style="padding:10px 14px;background:var(--bg-surf);border-top:1px solid var(--bd-sub);display:flex;gap:8px;flex-shrink:0">'+footer+'</div>':'')
      +'</div>';
  }
  // ── 섹션 타이틀
  function secTitle(t){
    return '<div style="font-size:10px;font-weight:700;color:var(--txm);letter-spacing:.5px;margin:14px 0 7px">'+t+'</div>';
  }
  // ── 입력 그룹
  function fg(label, required, input){
    return '<div style="margin-bottom:10px">'
      +'<div style="font-size:11px;color:var(--txm);margin-bottom:4px">'+label+(required?' <span style="color:var(--red)">*</span>':'')+'</div>'
      +input+'</div>';
  }
  function fi(placeholder, id, val){
    return '<input '+(id?'id="'+id+'"':'')+' placeholder="'+placeholder+'" value="'+(val||'')+'" style="width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--bd-def);background:var(--bg-surf);color:var(--tx);font-size:13px;outline:none;box-sizing:border-box;font-family:inherit"/>';
  }
  function fs(options, id){
    return '<select '+(id?'id="'+id+'"':'')+' style="width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--bd-def);background:var(--bg-surf);color:var(--tx);font-size:13px;outline:none;font-family:inherit">'
      +options.map(function(o){return '<option>'+o+'</option>';}).join('')
      +'</select>';
  }
  function fta(placeholder){
    return '<textarea placeholder="'+placeholder+'" style="width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--bd-def);background:var(--bg-surf);color:var(--tx);font-size:13px;outline:none;box-sizing:border-box;font-family:inherit;min-height:72px;resize:none"></textarea>';
  }
  function toggleBtns(items, name){
    return '<div style="display:flex;gap:6px;flex-wrap:wrap">'
      +items.map(function(item,i){
        return '<button class="to'+(i===0?' on':'')+'" onclick="mobScreenToggle(this,\''+name+'\')" style="padding:7px 14px;font-size:12px">'+item+'</button>';
      }).join('')+'</div>';
  }

  var body='', header='', footer='';

  // ═══════════════════════════════
  // 새 프로젝트
  // ═══════════════════════════════
  if(id==='proj-new'){
    header = screenHeader('새 프로젝트', '영업관리 모듈 — SSOT');

      +'<button class="to" onclick="mobScreenToggle(this,\'sale-type\')" style="padding:7px 14px;font-size:12px">유지보수</button>'
      +'</div>');

    body += fg('영업담당자', true, fs(['홍길동 (나)','김철수','이영희','박민수']));

// ── 풀스크린 화면 헬퍼 함수들
function mobScreenToggle(btn, group){
  var parent=btn.parentElement;
  parent.querySelectorAll('.to').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
}
function mobScreenToggleMulti(btn){ btn.classList.toggle('on'); }

function selectSupply(type){
  ['supplyDirect','supplyDist'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.classList.remove('on');
  });
  var target=type==='직납'?'supplyDirect':'supplyDist';
  var el=document.getElementById(target);
  if(el) el.classList.add('on');
  var area=document.getElementById('distArea');
  if(area) area.style.display=type==='유통'?'block':'none';
}
function selectMobMgmt(btn, idx){
  var parent=btn.parentElement;
  parent.querySelectorAll('.to').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  var area=document.getElementById('parentCustArea');
  if(area) area.style.display=idx===2?'block':'none';
}

function mobProjSearchCust(q){
  var res=document.getElementById('projCustResults');
  if(!res||!q) return;
  var matched=CUSTOMERS.filter(function(c){return c.name.indexOf(q)>=0;}).slice(0,4);
  if(!matched.length){res.innerHTML='<div style="font-size:11px;color:var(--txm);padding:4px">검색 결과 없음</div>';return;}
  var html='';
  matched.forEach(function(c){
    html+='<div onclick="selectProjCust(\''+c.name+'\')" style="padding:7px 9px;background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:6px;cursor:pointer;font-size:12px;color:var(--tx);margin-bottom:3px">'+c.name+'</div>';
  });
  res.innerHTML=html;
}
function selectProjCust(name){
  var inp=document.getElementById('projCustInput');
  if(inp) inp.value=name;
  var res=document.getElementById('projCustResults');
  if(res) res.innerHTML='';
  var sel=document.getElementById('projCustSelected');
  if(sel) sel.innerHTML='<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;background:var(--ac-glow);border:1px solid var(--ac);color:var(--ac);font-size:11px">'+name+' <span onclick="clearProjCust()" style="cursor:pointer;font-size:13px">&times;</span></span>';
}
function clearProjCust(){
  var inp=document.getElementById('projCustInput');
  if(inp) inp.value='';
  var sel=document.getElementById('projCustSelected');
  if(sel) sel.innerHTML='';
}
function submitMobProjNew(){
  var sel=document.getElementById('projCustSelected');
  if(!sel||!sel.textContent.trim()){toast('warn','필수 항목','앤드유저(고객사)를 선택해주세요');return;}
  closeMobScreen();
  toast('success','프로젝트 생성 완료','새 프로젝트가 등록되었습니다');
}

    for(var yri=0;yri<yrs2.length;yri++){var yr4=yrs2[yri];var yd=yMap[yr4];var yP=Math.round(yd.ours/yd.total*100);var yC=yP>=60?'var(--green)':yP>=40?'var(--orange)':'var(--red)';yRows+='<tr><td style="font-weight:700;color:var(--tx)">'+yr4+'년</td><td style="text-align:center">'+yd.total+'건</td><td style="text-align:center;color:var(--green);font-weight:600">'+yd.ours+'건</td><td style="text-align:center;color:'+(yd.total-yd.ours>0?'var(--orange)':'var(--txm)')+'">'+( yd.total-yd.ours)+'건</td><td style="text-align:center;color:'+yC+';font-weight:700">'+yP+'%</td><td><div style="flex:1;height:7px;background:var(--bg-over);border-radius:3px"><div style="height:100%;width:'+yP+'%;background:'+yC+';border-radius:3px"></div></div></td><td style="text-align:right;font-family:monospace;color:var(--green)">'+fmtAmt(yd.amt)+'</td></tr>';}
    bodyHtml=pFilter+iHtml+'<table class="pc-table" style="width:100%"><thead><tr><th>연도</th><th>전체</th><th>우리</th><th>경쟁사</th><th>점유율</th><th>점유 바</th><th>우리 금액</th></tr></thead><tbody>'+yRows+'</tbody></table>';
  }

  return '<div class="pc-content" style="display:flex;flex-direction:column;height:100%;overflow:hidden">'

    +'<div style="margin-bottom:12px"><div style="font-size:15px;font-weight:700;color:var(--tx)">조달분석</div>'

    +kpiHtml+tabHtml+'</div>'

}

    var actBody=mobSalesActSub==='캘린더'?mobCalendarContent():mobSalesActSub==='활동 분석'?mobActivityAnalysisMob():mobActivityList();
    body=actChips+actBody;
  } else if(mobSalesMainTab==='order'){
    body=mobOrderContent();
  } else {
    var analSubs=ANAL_SUB_DEF[role]||[];
    if(analSubs.indexOf(mobSalesAnalSub)<0) mobSalesAnalSub=analSubs[0]||'파이프라인';
    var analChips='<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 12px;flex-shrink:0">';
    for(var ni=0;ni<analSubs.length;ni++){

      analChips+='<button onclick="setMobSalesAnalSub(\''+nb+'\')" style="flex-shrink:0;padding:5px 14px;border-radius:20px;border:1.5px solid '+(non?'var(--ac)':'var(--bd-sub)')+';background:'+(non?'var(--ac-glow)':'transparent')+';color:'+(non?'var(--ac)':'var(--txm)')+';font-size:11px;font-weight:'+(non?700:400)+';cursor:pointer;font-family:inherit">'+nb+'</button>';
    }
    analChips+='</div>';
    body=analChips+mobAnalytics();
  }

  return top+tabBar+body;
}

function mobSalesProjTab(role){
  var chips1=PROJ_CHIP_DEF[role]||['내 프로젝트','전체 목록'];
  if(chips1.indexOf(mobSalesProjChip)<0) mobSalesProjChip=chips1[0];

  // 발주관리 선택 시 바로 발주 화면
  if(mobSalesProjChip==='발주관리'){
    var row1b='<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 12px;flex-shrink:0">';
    for(var xi=0;xi<chips1.length;xi++){

      row1b+='<button onclick="setMobSalesProjChip(\''+xc+'\')" style="flex-shrink:0;padding:5px 14px;border-radius:20px;border:1.5px solid '+(xon?'var(--orange)':'var(--bd-sub)')+';background:'+(xon?'rgba(255,140,66,.12)':'transparent')+';color:'+(xon?'var(--orange)':'var(--txm)')+';font-size:11px;font-weight:'+(xon?700:400)+';cursor:pointer;font-family:inherit">'+xc+'</button>';
    }
    row1b+='</div>';
    return row1b+mobOrderList();
  }

  // 1행: 내 프로젝트 / 전체 목록 원형 칩
  var row1='<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 12px 0;flex-shrink:0">';
  for(var ci=0;ci<chips1.length;ci++){
    var c1=chips1[ci]; var c1on=mobSalesProjChip===c1;
    var c1col=c1==='발주관리'?'var(--orange)':'var(--ac)';
    row1+='<button onclick="setMobSalesProjChip(\''+c1+'\')" style="flex-shrink:0;padding:5px 14px;border-radius:20px;border:1.5px solid '+(c1on?c1col:'var(--bd-sub)')+';background:'+(c1on?(c1==='발주관리'?'rgba(255,140,66,.12)':'var(--ac-glow)'):'transparent')+';color:'+(c1on?c1col:'var(--txm)')+';font-size:11px;font-weight:'+(c1on?700:400)+';cursor:pointer;font-family:inherit">'+c1+'</button>';
  }
  row1+='</div>';

  // 2행: Stage 원형 칩
  var stages=['전체','발굴','기회','진행','견적','계약중','긴급'];
  var STAGE_COLORS={'전체':'var(--ac)','발굴':'#8DA0BC','기회':'#4A92FF','진행':'#E0B800','견적':'#FF8C42','계약중':'#2ECC8A','긴급':'var(--red)'};
  var row2='<div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px 10px;flex-shrink:0">';
  for(var si=0;si<stages.length;si++){
    var sf=stages[si]; var sfon=mobSalesStageChip===sf;
    var sfc=STAGE_COLORS[sf]||'var(--ac)';
    row2+='<button onclick="setMobSalesStageChip(\''+sf+'\')" style="flex-shrink:0;padding:4px 12px;border-radius:20px;border:1.5px solid '+(sfon?sfc:'var(--bd-sub)')+';background:'+(sfon?sfc+'22':'transparent')+';color:'+(sfon?sfc:'var(--txm)')+';font-size:11px;font-weight:'+(sfon?700:400)+';cursor:pointer;font-family:inherit">'+sf+'</button>';
  }
  row2+='</div>';

  // 프로젝트 카드 필터링
  var projs=PROJECTS;
  if(mobSalesProjChip==='내 프로젝트') projs=PROJECTS.filter(function(p){return p.owner==='홍길동';});
  // 검색 필터 적용
  if(mobSalesSearchTerm) projs=projs.filter(function(p){return(p.name+p.customer+p.owner).toLowerCase().indexOf(mobSalesSearchTerm.toLowerCase())>=0;});
  if(mobSalesStageChip==='긴급'){
    projs=projs.filter(function(p){return p.alert&&p.alert.l==='red';});
  } else if(mobSalesStageChip!=='전체'){
    projs=projs.filter(function(p){var st=STAGE[p.stage]||STAGE.Lead; return st.label===mobSalesStageChip;});
  }

  var cards='<div class="mob-card-list">';
  for(var pi=0;pi<projs.length;pi++){
    var p=projs[pi]; var st=STAGE[p.stage]||STAGE.Lead;
    var al=p.alert?{red:'var(--red)',orange:'var(--orange)',blue:'var(--ac)'}[p.alert.l]||'var(--ac)':null;
    cards+='<div class="mob-card" style="border-left-color:'+st.color+'" onclick="setMobSelProj('+p.id+')">';
    cards+='<div class="mob-card-top"><div class="mob-card-name">'+p.name+'</div>';
    cards+='<span class="mob-stage-badge" style="background:'+st.bg+';color:'+st.color+';border:1px solid '+st.color+'30">'+st.label+'</span></div>';
    cards+='<div class="mob-card-mid">'+p.customer+' &middot; '+p.source+'</div>';
    cards+='<div class="mob-card-bot"><span class="mob-card-amt">&#8361;'+p.amount+'</span>';
    cards+='<div style="display:flex;gap:5px;align-items:center">';
    if(al) cards+='<span class="mob-badge" style="background:'+al+'18;color:'+al+';border:1px solid '+al+'40">'+p.alert.t+'</span>';
    cards+='<span class="mob-card-date">'+p.lastAct+'</span></div></div></div>';
  }
  if(!projs.length) cards+='<div style="text-align:center;padding:40px 0;color:var(--txm);font-size:12px">해당 프로젝트가 없습니다</div>';
  cards+='</div>';

  return row1+row2+cards;
}

// 이벤트
function setMobTab(k){
  if(k==='dashboard'){
    S.mobTab='dashboard';
  } else if(k==='sales'){
    S.mobTab='sales';
  } else if(k==='sales_proj'){
    S.mobTab='sales'; mobSalesMainTab='proj';
  } else if(k==='sales_act'){
    S.mobTab='sales'; mobSalesMainTab='act';
  } else if(k==='analytics'){
    S.mobTab='sales'; mobSalesMainTab='anal';
  } else if(k==='calendar'||k==='schedule'){
    S.mobTab='schedule';
  } else {
    S.mobTab=k;
  }
  S.mobMore=false;
  renderMob();
}
function toggleMobMore(){S.mobMore=!S.mobMore;renderMob()}
function closeMobMore(){S.mobMore=false;renderMob()}
function navMobMore(k){S.mobTab=k;S.mobMore=false;renderMob()}
function setMobSelProj(id){S.mobSelProj=id;renderMob()}
function closeMobSelProj(){S.mobSelProj=null;renderMob()}

function toggleRoleDropdown(){
  const menu=document.getElementById('role-dropdown-menu');
  if(menu) menu.classList.toggle('open');
}
// 외부 클릭시 드롭다운 닫기
document.addEventListener('click',function(e){
  const wrap=document.querySelector('.role-dropdown-wrap');
  if(wrap&&!wrap.contains(e.target)){
    const menu=document.getElementById('role-dropdown-menu');
    if(menu) menu.classList.remove('open');
  }
});
// 이벤트 위임 — mob-app
document.addEventListener('click', function(e){
  // 영업관리 서브탭
  var subBtn = e.target.closest('.mob-sub-btn');
  if(subBtn){
    S.mobSalesTab = decodeURIComponent(subBtn.getAttribute('data-sub'));
    S.mobTab = 'sales';
    renderMob();
    return;
  }
  // 역할 선택
  var roleOpt = e.target.closest('.mob-role-opt');
  if(roleOpt){
    setRole(roleOpt.getAttribute('data-role'));
    S.mobRoleOpen = false;
    return;
  }
  // 역할 토글 버튼
  var roleToggle = e.target.closest('.mob-role-toggle');
  if(roleToggle){
    S.mobRoleOpen = !S.mobRoleOpen;
    renderMob();
    return;
  }
});

// 초기화
renderPC();renderMob();
Object.keys(ROLE_INFO).forEach(k=>{
  const el=document.getElementById('rb-'+k);
  if(el) el.className='role-option'+(k===S.role?' on':'');
});
autoView();

var mobMailFolder='inbox';   // inbox/sent/draft
var mobMailSelId=null;       // 선택된 메일 ID
var mobMailView='list';      // list/detail/compose/settings

function mobMailContent(){

// ── 메일 목록 ──
function mobMailList(){
  var list=MAILS.filter(function(m){return m.folder===mobMailFolder;});
  var unread=MAILS.filter(function(m){return m.folder==='inbox'&&!m.is_read;}).length;

  var html='';
  // 계정 상태 바
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  html+='<div style="display:flex;align-items:center;gap:6px">';
  html+='<div style="width:8px;height:8px;border-radius:50%;background:var(--green)"></div>';
  html+='<span style="font-size:11px;color:var(--tx2)">'+MAIL_ACCOUNT.email+'</span>';
  html+='<span style="font-size:10px;color:var(--txm)">'+MAIL_ACCOUNT.last_synced+'</span>';
  html+='</div>';
  html+='<div style="display:flex;gap:5px">';
  html+='<button onclick="mobMailView=\'settings\';renderMob()" style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:6px;padding:4px 8px;color:var(--txm);font-size:11px;cursor:pointer;font-family:inherit">⚙️ 설정</button>';
  html+='<button onclick="mobMailView=\'compose\';renderMob()" style="background:var(--ac);border:none;border-radius:6px;padding:4px 10px;color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">+ 작성</button>';
  html+='</div></div>';

  // 폴더 탭
  html+='<div style="display:flex;gap:4px;margin-bottom:10px">';
  [{key:'inbox',label:'받은편지함',badge:unread},{key:'sent',label:'보낸편지함',badge:0},{key:'draft',label:'임시보관함',badge:0}].forEach(function(f){
    var on=mobMailFolder===f.key;
    html+='<button onclick="mobMailFolder=\''+f.key+'\';renderMob()" style="flex:1;padding:6px 4px;border-radius:6px;border:1px solid '+(on?'var(--ac)':'var(--bd-sub)')+';background:'+(on?'var(--ac-glow)':'transparent')+';color:'+(on?'var(--ac)':'var(--txm)')+';font-size:10px;cursor:pointer;font-family:inherit;position:relative">';
    html+=f.label;
    if(f.badge>0) html+='<span style="position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px">'+f.badge+'</span>';
    html+='</button>';
  });
  html+='</div>';

  // 메일 목록
  if(!list.length){
    html+='<div style="text-align:center;padding:40px;color:var(--txm);font-size:12px">메일이 없습니다</div>';
  } else {
    list.forEach(function(m){
      var isUnread=!m.is_read&&m.folder==='inbox';
      html+='<div onclick="mobMailSelId='+m.id+';renderMob()" style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;'+(isUnread?'border-left:3px solid var(--ac)':'')+'">';
      // 1행: 발신자 + 날짜
      html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">';
      html+='<span style="font-size:12px;font-weight:'+(isUnread?'700':'500')+';color:'+(isUnread?'var(--tx)':'var(--tx2)')+'">'+m.from_name+'</span>';
      html+='<div style="display:flex;align-items:center;gap:5px">';
      if(m.has_attachment) html+='<span style="font-size:11px;color:var(--txm)">📎</span>';
      html+='<span style="font-size:10px;color:var(--txm)">'+m.date+'</span>';
      html+='</div></div>';
      // 2행: 제목
      html+='<div style="font-size:12px;font-weight:'+(isUnread?'600':'400')+';color:'+(isUnread?'var(--tx)':'var(--tx2)')+';margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+m.subject+'</div>';
      // 3행: 미리보기
      html+='<div style="font-size:10px;color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px">'+m.preview+'</div>';
      // 4행: 연결 배지
      html+='<div style="display:flex;gap:4px;flex-wrap:wrap">';
      if(m.match_status==='AUTO'&&m.customer){
        html+='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(72,199,142,.12);color:var(--green);border:1px solid rgba(72,199,142,.3)">✓ '+m.customer+'</span>';
        if(m.project) html+='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:var(--ac-glow);color:var(--ac);border:1px solid rgba(91,156,246,.3)">'+m.project+'</span>';
      } else if(m.match_status==='SEMI'){
        html+='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(255,160,96,.12);color:var(--orange);border:1px solid rgba(255,160,96,.3)">? 연결 확인 필요</span>';
      } else if(m.match_status==='UNMATCHED'){
        html+='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:var(--bg-raise);color:var(--txm);border:1px solid var(--bd-sub)">미연결</span>';
      }
      html+='</div></div>';
    });
  }
  return html;
}

  html+='</div>';

  function fRow(label,placeholder,type,required){
    return '<div style="margin-bottom:10px">'

  html+='<div style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:12px;margin-bottom:10px">';
  html+=fRow('발신자','hong@anser.kr','input');

  // 본문
  html+='<div style="margin-bottom:10px">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">';
  html+='<div style="font-size:10px;color:var(--txm)">본문</div>';
  html+='<button style="font-size:10px;color:var(--ac);background:none;border:none;cursor:pointer;font-family:inherit">📋 템플릿 불러오기</button>';
  html+='</div>';
  html+='<textarea placeholder="메일 내용을 입력하세요..." class="fta" style="min-height:180px"></textarea>';
  html+='</div>';

  // 서명
  html+='<div style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:6px;padding:10px 12px;margin-bottom:10px">';
  html+='<div style="font-size:10px;color:var(--txm);margin-bottom:4px">서명 (자동 삽입)</div>';
  html+='<div style="font-size:11px;color:var(--tx2);line-height:1.7">홍길동 드림<br>앤서시스템 | 영업담당<br>010-1234-5678 | hong@anser.kr</div>';
  html+='</div>';

  html+='<div style="display:flex;gap:6px">';
  html+='<label style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;border-radius:8px;border:1px dashed var(--bd-str);background:transparent;color:var(--txm);font-size:11px;cursor:pointer">';

function daysBetween(dateStr){
  var today=new Date('2026-05-30');
  var target=new Date(dateStr);
  return Math.round((target-today)/(1000*60*60*24));
}

function setDocSrch(v){

  window._dst=setTimeout(function(){renderMob();},300);
}

  html+='<button style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--ac);background:var(--ac-glow);color:var(--ac);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">열기/다운로드</button>';
  html+='<button onclick="showPP(\'doc-upload\',{id:'+d.id+',version:true})" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--bd-str);background:var(--bg-surf);color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit">버전 업로드</button>';
  html+='</div>';

  if(d.sender){
    html+='<div style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:4px 12px;margin-bottom:10px">';
    html+='<div style="font-size:10px;font-weight:700;color:var(--txm);padding:8px 0 4px">■ 발송 이력</div>';
    html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd-sub)">';
    html+='<div><div style="font-size:11px;color:var(--tx)">'+d.sender+' → 고객 이메일 발송</div><div style="font-size:10px;color:var(--txm)">'+d.updated+'</div></div>';

  }

  // 버전 이력
  html+='<div style="font-size:11px;font-weight:600;color:var(--txm);margin-bottom:6px">● 버전 이력</div>';
  html+='<div style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;overflow:hidden">';

    html+='<span style="font-size:11px;font-weight:700;color:'+(v===d.version?'var(--ac)':'var(--txm)')+';width:28px">v'+v+'</span>';
    html+='<span style="font-size:11px;color:var(--tx2);flex:1">'+(v===d.version?'최신':'이전 버전')+'</span>';
    if(v===d.version) html+='<span style="font-size:10px;color:var(--ac)">현재</span>';
    else html+='<span style="font-size:10px;color:var(--txm);cursor:pointer">복원</span>';
    html+='</div>';
  }
  html+='</div>';

  // 삭제/무효화 버튼
  html+='<div style="margin-top:12px">';
  if(d.deletable){
    html+='<button style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:var(--red);font-size:12px;cursor:pointer;font-family:inherit">삭제</button>';
  } else {
    html+='<button style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd-sub);background:var(--bg-raise);color:var(--txm);font-size:12px;cursor:default;font-family:inherit">🔒 삭제 불가 문서 (보존기간 5년)</button>';
  }
  html+='</div>';

  return html;
}

function mobProductsContent(){
  if(mobProdSelId===-1) return mobProdExpireScreen();

  var list=PRODUCTS.filter(function(p){
    if(mobProdFilter==='조달등록') return p.source==='PROCUREMENT';
    if(mobProdFilter==='미등록')   return p.source==='TENANT';
    return true;
  }).filter(function(p){
    var tl={'제품':'PRODUCT','라이선스':'LICENSE','서비스':'SERVICE','유지관리':'MAINTENANCE'};
    if(mobProdTypeFilter!=='전체') return p.type===tl[mobProdTypeFilter];
    return true;
  }).filter(function(p){
    if(mobProdStatus==='사용중') return p.status==='ACTIVE';
    if(mobProdStatus==='중지')   return p.status==='INACTIVE';
    if(mobProdStatus==='단종')   return p.status==='DISCONTINUED';

    return true;

    if(!mobProdSearch) return true;
    var q=mobProdSearch.toLowerCase();

        ||(p.model||'').toLowerCase().indexOf(q)>=0
        ||(p.code||'').indexOf(q)>=0
        ||(p.supplier||'').toLowerCase().indexOf(q)>=0;

  });

  // 검색창
  html+='<div style="display:flex;gap:6px;margin-bottom:8px">';
  html+='<div style="flex:1;display:flex;align-items:center;gap:6px;background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:0 10px;height:36px">'+I('search',13,'var(--txm)');
  html+='<input id="prodSrch" placeholder="품명, 물품식별번호, 모델명, 업체명..." value="'+mobProdSearch+'" oncompositionstart="_custSearchComposing=true" oncompositionend="_custSearchComposing=false;setProdSrch(this.value)" oninput="setProdSrch(this.value)" style="background:none;border:none;outline:none;font-size:15px;color:var(--tx);width:100%;font-family:inherit"></div>';
  html+='<button onclick="mobProdSelId=-2;renderMob()" style="width:36px;height:36px;border-radius:8px;background:var(--ac);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">+</button>';
  html+='</div>';

  // 필터 3행
  html+=prodFilterRow(['전체','조달등록','미등록'],'mobProdFilter');

    list.forEach(function(p){
      var srcC=p.source==='PROCUREMENT'?'var(--ac)':'var(--txm)';
      var srcL=p.source==='PROCUREMENT'?'조달':'미등록';
      var stC=p.status==='ACTIVE'?'var(--green)':p.status==='INACTIVE'?'var(--txm)':'var(--red)';
      var stL=p.status==='ACTIVE'?'사용중':p.status==='INACTIVE'?'중지':'단종';
      html+='<div onclick="mobProdSelId='+p.id+';mobProdTab=\'기본정보\';renderMob()" style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-left:3px solid '+srcC+';border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer">';

      html+='<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">';

      html+='<span style="margin-left:auto;font-size:10px;color:'+stC+'">'+stL+'</span>';

      html+='<div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:1px">'+p.model+'</div>';

      html+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';

      html+='<span style="font-size:11px;font-weight:600;color:var(--ac)">'+p.price.toLocaleString()+'원</span>';
      html+='<span style="font-size:10px;color:var(--bd-str)">·</span>';
      html+='<span style="font-size:10px;color:var(--txm)">'+p.supplier+'</span>';
      if(p.purchase_method) { html+='<span style="font-size:10px;color:var(--bd-str)">·</span><span style="font-size:10px;color:var(--txm)">'+p.purchase_method+'</span>'; }
      html+='</div>';
      if(p.is_stock){ var sc2=p.stock===0?'var(--red)':p.stock<=2?'var(--orange)':'var(--green)'; html+='<div style="margin-top:5px;font-size:10px;color:'+sc2+'">재고 '+p.stock+'개</div>'; }
      html+='</div>';
    });
  }

  // 만료알림 버튼
  html+='<div style="margin-top:10px"><button onclick="mobProdSelId=-1;renderMob()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--orange);background:rgba(255,160,96,.08);color:var(--orange);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">⚠️ 만료 알림 현황 보기</button></div>';
  return html;
}

function prodFilterRow(items,varName){
  var cur=window[varName]||'전체';
  var h='<div style="display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap">';
  items.forEach(function(f){
    var on=cur===f;
    h+='<button onclick="'+varName+'=\''+f+'\';renderMob()" style="padding:4px 10px;border-radius:5px;border:1px solid '+(on?'var(--ac)':'var(--bd-sub)')+';background:'+(on?'var(--ac-glow)':'transparent')+';color:'+(on?'var(--ac)':'var(--txm)')+';font-size:11px;cursor:pointer;font-family:inherit">'+f+'</button>';
  });
  return h+'</div>';
}

  if(p.source==='PROCUREMENT') tabs.push('조달계약');

  if(p.type==='PRODUCT'||p.type==='LICENSE') tabs.push('시리얼');
  if(p.is_stock) tabs.push('재고');
  tabs.push('채널정보');
  if(tabs.indexOf(mobProdTab)<0) mobProdTab='기본정보';

  var html='';
  // 헤더
  html+='<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">';
  html+='<button onclick="mobProdSelId=null;renderMob()" style="background:none;border:none;cursor:pointer;padding:0;margin-top:2px;flex-shrink:0">'+I('arrowL',18,'var(--ac)')+'</button>';
  html+='<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:var(--tx)">'+p.model+'</div><div style="font-size:11px;color:var(--tx2)">'+p.name+'</div></div>';
  html+='<div style="display:flex;gap:5px"><button style="padding:5px 8px;border-radius:6px;border:1px solid var(--bd-sub);background:var(--bg-surf);color:var(--txm);font-size:11px;cursor:pointer;font-family:inherit">수정</button><button style="padding:5px 8px;border-radius:6px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.08);color:var(--red);font-size:11px;cursor:pointer;font-family:inherit">삭제</button></div>';
  html+='</div>';
  // 배지
  html+='<div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap">';
  html+='<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:'+srcC+'18;color:'+srcC+';border:1px solid '+srcC+'33">'+srcL+'</span>';
  html+='<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg-raise);color:var(--txm);border:1px solid var(--bd-sub)">'+typeL+'</span>';
  html+='<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:'+stC+'18;color:'+stC+';border:1px solid '+stC+'33">'+stL+'</span>';
  if(p.dday&&p.dday<=30) html+='<span style="font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(255,160,96,.15);color:var(--orange);border:1px solid rgba(255,160,96,.3)">⚠️ 만료 D-'+p.dday+'</span>';
  html+='</div>';
  // 탭
  html+='<div style="display:flex;gap:3px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch">';
  tabs.forEach(function(t){
    var on=mobProdTab===t;
    html+='<button onclick="mobProdTab=\''+t+'\';renderMob()" style="flex-shrink:0;padding:5px 10px;border-radius:6px;border:1px solid '+(on?'var(--ac)':'var(--bd-sub)')+';background:'+(on?'var(--ac-glow)':'transparent')+';color:'+(on?'var(--ac)':'var(--txm)')+';font-size:11px;font-weight:'+(on?'700':'400')+';cursor:pointer;font-family:inherit;white-space:nowrap">'+t+'</button>';
  });
  html+='</div>';

  if(mobProdTab==='기본정보')   html+=pTabBasic(p);
  else if(mobProdTab==='가격정책')  html+=pTabPrice(p);
  else if(mobProdTab==='조달계약')  html+=pTabContract(p);
  else if(mobProdTab==='인증서')   html+=pTabCert(p);
  else if(mobProdTab==='시리얼')   html+=pTabSerial(p);
  else if(mobProdTab==='재고')     html+=pTabStock(p);
  else if(mobProdTab==='채널정보') html+=pTabChannel(p);
  return html;
}

function pRow(l,v,c){
  if(v===null||v===undefined||v==='') v='-';
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd-sub)"><span style="font-size:11px;color:var(--txm);flex-shrink:0;margin-right:10px">'+l+'</span><span style="font-size:12px;color:'+(c||'var(--tx)')+';text-align:right">'+v+'</span></div>';
}

function pCard(content){
  return '<div style="background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:4px 12px;margin-bottom:10px">'+content+'</div>';
}

function pSection(title){

function pTabChannel(p){
  var roleL={MANUFACTURER:'제조사',DISTRIBUTOR:'총판',PARTNER:'파트너',RESELLER:'리셀러',DIRECT:'직판'};

  // 우리 역할

    p.channel.commission.forEach(function(c,i){
      var gc=gradeC[c.grade]||'var(--tx2)';

      h+='<span style="font-size:10px;color:var(--txm);flex:1">'+c.type+'</span>';
      h+='<span style="font-size:11px;color:var(--ac);flex:1">'+c.sales+'%</span>';
      h+='<span style="font-size:11px;color:var(--tx2);flex:1">'+(c.tech?c.tech+'%':'-')+'</span>';

// 만료 알림 현황 — D-7/D-30 구분
// ════════════════════════════════════════
function mobProdExpireScreen(){
  var html='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
  html+='<button onclick="mobProdSelId=null;renderMob()" style="background:none;border:none;cursor:pointer;padding:0;color:var(--ac)">'+I('arrowL',18,'var(--ac)')+'</button>';
  html+='<div style="font-size:15px;font-weight:700;color:var(--tx)">만료 알림 현황</div></div>';

  // 탭
  html+='<div style="display:flex;gap:4px;margin-bottom:12px">';
  ['전체','조달계약','인증서','라이선스'].forEach(function(t){
    var on=mobProdExpireTab===t;
    html+='<button onclick="mobProdExpireTab=\''+t+'\';renderMob()" style="flex:1;padding:6px 4px;border-radius:6px;border:1px solid '+(on?'var(--orange)':'var(--bd-sub)')+';background:'+(on?'rgba(255,160,96,.1)':'transparent')+';color:'+(on?'var(--orange)':'var(--txm)')+';font-size:10px;cursor:pointer;font-family:inherit;white-space:nowrap">'+t+'</button>';
  });
  html+='</div>';

  // 항목 수집
  var d7=[],d30=[];
  PRODUCTS.forEach(function(p){
    if(mobProdExpireTab==='전체'||mobProdExpireTab==='인증서'){
      p.certs.forEach(function(c){
        if(c.dday<=7) d7.push({prod:p.model,item:c.type,expire:c.expire,dday:c.dday,action:'인증갱신'});
        else if(c.dday<=30) d30.push({prod:p.model,item:c.type,expire:c.expire,dday:c.dday,action:'인증갱신'});
      });
    }
    if(p.dday&&(mobProdExpireTab==='전체'||mobProdExpireTab==='조달계약')){
      var item={prod:p.model,item:'조달계약',expire:'2026-06-01',dday:p.dday,action:'계약갱신'};
      if(p.dday<=7) d7.push(item); else if(p.dday<=30) d30.push(item);
    }
  });

  function expCard(item,color){

function getPPRoot(){
  let el = document.getElementById('pp-root');
  if(!el){
    el = document.createElement('div');
    el.id = 'pp-root';
    el.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none';
    document.body.appendChild(el);
  }
  return el;
}

// 모바일 전용 화면 ID 목록 (PC는 팝업 유지)
var MOB_SCREEN_IDS=['proj-new','cust-new','contact-add','contact-edit','contact-move','contact-delete','activity','cust-edit','narajangteo'];



function showPP(id, d={}){
  // 모바일 팝업 대상은 항상 인앱 오버레이로 처리
  var pcPanel = document.getElementById('pc-panel');
  var isMobOnly = pcPanel && window.getComputedStyle(pcPanel).display === 'none';
  var mobPanel = document.getElementById('mob-panel');
  var isMobVisible = mobPanel && window.getComputedStyle(mobPanel).display !== 'none';
  if((isMobOnly || isMobVisible) && MOB_SCREEN_IDS.indexOf(id)>=0){
    openMobScreen(id, d);
    return;
  }
  // PC: 모든 팝업을 인라인 오버레이로 처리 (window.open 미사용 — iPad/Safari 호환)
  const allFns = {
    'alert':ppAlert,'confirm':ppConfirm,'danger':ppDanger,'inputc':ppInputC,
    'proj-new':ppProjNew,'activity':ppActivity,'cust-new':ppCustNew,'contact-add':ppContactAdd,
    'contact-edit':ppContactEdit,'contact-move':ppContactMove,'contact-delete':ppContactDelete,
    'assign':ppAssign,'stage':ppStage,'prod-add':ppProdAdd,'invoice-transfer':ppInvoiceTransfer,'maint-transfer':ppMaintTransfer,'narajangteo':ppNarajangteo,
    'quote-ok':ppQuoteOk,'quote-send':ppQuoteSend,'order':ppOrder,
    'quick':ppQuick,'prod-search':ppProdSearch,'cust-edit':ppCustNew,
  };
  const fn = allFns[id];
  if(!fn) return;
  const root = getPPRoot();
  const innerHtml = fn(d);
  const tmp = document.createElement('div');
  tmp.innerHTML = innerHtml;
  const hasOv = !!tmp.querySelector('.ov');
  if(hasOv){
    // .ov 자체가 fixed 오버레이 — root는 포인터만 활성화
    root.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:auto';
    root.onclick = null;
  } else {
    // .pp만 있는 경우 — root가 오버레이 역할
    root.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:auto;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)';
    root.onclick = function(e){ if(e.target===root) closePP(); };
  }
  root.innerHTML = innerHtml;
  // narajangteo 초기 렌더
  if(id==='narajangteo') setTimeout(function(){ if(typeof renderNaraResult==='function') renderNaraResult(); },50);
  // 팝업 내 input font-size 16px 강제 (iOS 확대 방지)
  root.querySelectorAll('input,select').forEach(function(el){
    el.style.fontSize='16px';
  });
  // fta / contenteditable 키패드 입력바 바인딩
  setTimeout(function(){
    root.querySelectorAll('.fta,[contenteditable="true"]').forEach(function(el){
      if(el._kbPpBound) return;
      el._kbPpBound=true;
      el.addEventListener('focus',function(){
        _kbTarget=el;
        _kbIsContent=el.getAttribute('contenteditable')==='true';
        _kbHasAttach=true;
        kbShow();
      });
      el.addEventListener('blur',function(){
        setTimeout(function(){
          var active=document.activeElement;
          var bar=document.getElementById('kb-bar');
          if(bar&&bar.contains(active)) return;
          kbHide();
        },200);
      });
    });
  },50);
}

function openMobScreen(id, d){
  mobScreen=id; mobScreenData=d||{}; renderMob();
}
function closeMobScreen(){
  mobScreen=null; mobScreenData={}; renderMob();
}

function closePP(){
  const root = document.getElementById('pp-root');
  if(root){
    root.innerHTML = '';
    root.style.pointerEvents = 'none';
    root.style.background = '';
    root.style.display = '';
    root.style.backdropFilter = '';
    root.onclick = null;
  }

}

// ── 토스트 ───────────────────────────────
let _tsN = 0;
function toast(type, title, msg='', ms=0){
  let wrap = document.getElementById('toast-root');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toast-root';
    document.body.appendChild(wrap);
  }
  const id = 'ts-'+(++_tsN);
  const map = {success:['ts-s','var(--green)','✓'],error:['ts-e','var(--red)','✕'],warn:['ts-w','var(--orange)','⚠'],info:['ts-i','var(--ac)','ℹ']};
  const [cls,col,ico] = map[type]||map.info;
  const auto = {success:3000,warn:5000,info:3000,error:0};
  const t = ms||(auto[type]||3000);
  const el = document.createElement('div');
  el.id = id; el.className = `ts ${cls}`;
  el.innerHTML = `<span class="ts-ic" style="color:${col}">${ico}</span><div class="ts-bd"><div class="ts-t">${title}</div>${msg?`<div class="ts-m">${msg}</div>`:''}</div><span class="ts-x" onclick="rmTs('${id}')">✕</span>`;
  wrap.appendChild(el);
  const all = wrap.querySelectorAll('.ts');
  if(all.length > 3) all[0].remove();
  if(t > 0) setTimeout(()=>rmTs(id), t);
}
function rmTs(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('out');
  setTimeout(()=>el.remove(), 200);
}

  +'<div class="tg" id="custTypeGroup">'+typeButtons+'</div>'
  +'</div>'

  +'<div class="fg">'
  +'<div class="fl">관리 유형 <span class="fr">*</span></div>'
  +'<div class="tg">'

// 고객유형 선택
function selectCustType(btn){
  document.querySelectorAll('#custTypeGroup .to').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
}

// 관리유형 선택
function custMgmtSel(btn, idx){
  ['mtb_ind','mtb_intg','mtb_sub'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.classList.remove('on');
  });
  btn.classList.add('on');
  var area=document.getElementById('parentCustArea');
  if(area) area.style.display=(idx===2)?'block':'none';
}

// 관리유형 툴팁
function toggleMgmtTooltip(){
  var t=document.getElementById('mgmtTooltip');
  if(t) t.style.display=(t.style.display==='none'?'block':'none');
}

// 사업자번호 포맷 (000-00-00000)
function custBizFmt(input){
  var v=input.value.replace(/[^0-9]/g,'');
  if(v.length>5) v=v.slice(0,3)+'-'+v.slice(3,5)+'-'+v.slice(5,10);
  else if(v.length>3) v=v.slice(0,3)+'-'+v.slice(3);
  input.value=v;
  var warn=document.getElementById('bizWarn');
  if(warn) warn.style.display=(v.replace(/-/g,'').length>=10)?'block':'none';
}

// 상위 고객사 검색
function custParentSearch(q){
  var res=document.getElementById('parentCustResults');
  if(!res) return;
  if(!q){res.innerHTML='';return;}
  var matched=CUSTOMERS.filter(function(c){return c.name.indexOf(q)>=0;});
  if(!matched.length){
    res.innerHTML='<div style="font-size:11px;color:var(--txm);padding:4px 0">검색 결과 없음</div>';
    return;
  }
  var html='';
  for(var i=0;i<Math.min(matched.length,5);i++){
    var cc=matched[i];
    html+='<div onclick="custParentPick(\''+cc.name+'\')" '
         +'style="padding:7px 10px;background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:6px;cursor:pointer;font-size:11px;color:var(--tx);margin-bottom:3px;display:flex;align-items:center;gap:6px">'
         +svg(ICO.customers,12,'var(--ac)')+cc.name+'</div>';
  }
  res.innerHTML=html;
}
function custParentPick(name){
  var inp=document.getElementById('parentCustInput');
  if(inp) inp.value=name;
  var res=document.getElementById('parentCustResults');
  if(res) res.innerHTML='<div style="padding:6px 8px;background:var(--ac-glow);border:1px solid var(--ac);border-radius:6px;font-size:11px;color:var(--ac);display:flex;align-items:center;gap:5px">'+svg(ICO.check,12,'var(--ac)')+name+' 선택됨</div>';
}

// 등록 처리
function custNewSubmit(){
  var typeBtn=document.querySelector('#custTypeGroup .to.on');
  var nameEl=document.getElementById('custNameInput');
  var subBtn=document.getElementById('mtb_sub');
  var parentInp=document.getElementById('parentCustInput');
  if(!typeBtn){toast('warn','필수 항목','고객 유형을 선택해주세요');return;}
  if(!nameEl||!nameEl.value.trim()){toast('warn','필수 항목','고객명을 입력해주세요');return;}
  if(subBtn&&subBtn.classList.contains('on')&&parentInp&&!parentInp.value.trim()){
    toast('warn','필수 항목','소속개별의 경우 상위 고객사를 선택해주세요');return;
  }
  closePP();
  toast('success','고객사 등록 완료',nameEl.value.trim()+' 등록되었습니다');
}

  const p = PROJ.find(x=>x.id===(d.id||1)) || {name:'강동구청 보안솔루션 도입',cust:'강동구청',owner:'홍길동',stage:'Quote',amount:'42,000,000',prob:75,target:'2025.06',margin:'8,400,000',alert:{l:'o',t:'D-8'}};
  const ST = typeof STAGE !== 'undefined' ? STAGE : {};
  const st = ST[p.stage] || {bg:'#2a1500',c:'var(--orange)',lbl:'견적'};
  const pc2 = p.prob>=80?'var(--green)':p.prob>=50?'var(--orange)':'var(--red)';
  return `<div class="ov" onclick="if(event.target===this)closePP()">
  <div class="pp sm">
    <div class="pp-hd">
      <div>
        <div class="pp-ttl">${p.name}</div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:3px">
          <span style="background:${st.bg};color:${st.c||st.color};padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700">${st.lbl||st.label}</span>
          <span style="font-size:11px;color:var(--txm)">${p.owner}</span>
        </div>
      </div>
      <div class="pp-x" onclick="closePP()">✕</div>
    </div>
    <div class="pp-bd">
      <div class="f2" style="margin-bottom:11px">${[['예상금액','₩'+(p.amount||''),('var(--tx)')],['수주가능성',(p.prob||0)+'%',pc2],['예상수주월',p.target||'-','var(--tx2)'],['마진','₩'+(p.margin||''),'var(--green)']].map(([l,val,c])=>`<div style="background:var(--bg-raise);border:1px solid var(--bd-def);border-radius:5px;padding:7px 8px"><div style="font-size:9px;color:var(--txm);margin-bottom:1px">${l}</div><div style="font-size:12px;font-weight:700;color:${c};font-family:monospace">${val}</div></div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;padding-bottom:8px;border-bottom:1px solid var(--bd-def);margin-bottom:8px"><span style="color:var(--txm)">앤드유저</span><span style="color:var(--tx);font-weight:500">${p.cust||''}</span></div>
      <div style="font-size:10px;font-weight:700;color:var(--txm);margin-bottom:6px">최근 활동</div>
      ${[['미팅','견적 최종 협의','2일 전'],['이메일','견적서 발송','5일 전'],['전화','납품 일정 조율','9일 전']].map(([t,desc,dt])=>`<div style="display:flex;gap:7px;padding:4px 0;border-bottom:1px solid var(--bd-def)"><span style="font-size:10px;background:var(--bg-raise);padding:1px 5px;border-radius:3px;color:var(--tx2);flex-shrink:0">${t}</span><span style="font-size:11px;color:var(--tx);flex:1">${desc}</span><span style="font-size:10px;color:var(--txm)">${dt}</span></div>`).join('')}
      ${p.alert?`<div style="margin-top:9px;padding:6px 9px;border-radius:5px;background:${p.alert.l==='r'?'rgba(255,77,77,.1)':'rgba(255,140,66,.1)'};border-left:3px solid ${p.alert.l==='r'?'var(--red)':'var(--orange)'};font-size:11px;display:flex;justify-content:space-between;color:var(--tx)"><span>${p.name.slice(0,16)}…</span><span style="font-weight:700;color:${p.alert.l==='r'?'var(--red)':'var(--orange)'}">${p.alert.t}</span></div>`:''}
    </div>
    <div class="pp-ft">
      <button class="pbg" onclick="showPP('activity',{project:'${p.name}'})">활동 등록</button>
      <button class="pbp" onclick="closePP()${typeof setPcSel!=='undefined'?';setPcSel('+(p.id||1)+')':''}">상세 보기 →</button>
    </div>
  </div></div>`;
}

// ── 6-2. 상품 검색·선택 ──────────────────
function ppProdSearch(d={}){

          <td style="padding:6px 7px;font-family:monospace;color:var(--txm);border-bottom:1px solid var(--bd-def)">${p.code}</td>

        <div style="display:flex;align-items:center;gap:9px">
          <span style="flex:1;font-size:11px;color:var(--tx);font-weight:500">방화벽 A (FW-2000)</span>
          <input type="number" value="3" style="width:55px;padding:4px 7px;border-radius:5px;border:1px solid var(--bd-str);background:var(--bg-surf);color:var(--tx);font-size:12px;text-align:center"/>
          <span style="font-size:11px;color:var(--txm)">대</span>
          <span class="stx">✕</span>
        </div>
      </div>
    </div>
    <div class="pp-ft"><button class="pbg" onclick="closePP()">취소</button><button class="pbp" onclick="closePP();toast('success','제품 추가','라인업에 추가되었습니다')">제품 라인업에 추가</button></div>
  </div></div>`;
}
</script>

<!-- ── 키패드 위 고정 입력바 ── -->
<div id="kb-bar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#1c2230;border-top:1px solid #2d3f5a;padding:8px 12px;padding-bottom:env(safe-area-inset-bottom,8px)">
  <div style="display:flex;align-items:flex-end;gap:8px">
    <!-- + 첨부 버튼 -->
    <button id="kb-attach-btn" onclick="kbAttach()" style="flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#243045;border:1px solid #2d3f5a;color:#94a3b8;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit">+</button>
    <!-- 텍스트 입력 -->
    <textarea id="kb-input" rows="1" placeholder="입력..." oninput="kbResize(this)" style="flex:1;background:#111827;border:1px solid #2d3f5a;border-radius:18px;padding:8px 14px;color:#e2e8f0;font-size:15px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.4;box-sizing:border-box;overflow-y:auto"></textarea>
    <!-- 음성 버튼 -->
    <button id="kb-voice-btn" onclick="kbVoice()" style="flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#243045;border:1px solid #2d3f5a;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">🎤</button>
    <!-- 확인 버튼 -->
    <button onclick="kbConfirm()" style="flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#5B9CF6;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">✓</button>
  </div>
  <!-- 첨부 선택 시트 -->
  <div id="kb-attach-sheet" style="display:none;margin-top:8px;display:none">
    <div style="display:flex;gap:10px">
      <label style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px;background:#243045;border-radius:10px;border:1px solid #2d3f5a;cursor:pointer;font-size:11px;color:#94a3b8">
        <span style="font-size:24px">📁</span>파일
        <input type="file" style="display:none" onchange="kbFileSelected(this,'file')">
      </label>
      <label style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px;background:#243045;border-radius:10px;border:1px solid #2d3f5a;cursor:pointer;font-size:11px;color:#94a3b8">
        <span style="font-size:24px">📷</span>사진
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="kbFileSelected(this,'photo')">
      </label>
      <label style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px;background:#243045;border-radius:10px;border:1px solid #2d3f5a;cursor:pointer;font-size:11px;color:#94a3b8">
        <span style="font-size:24px">🖼️</span>갤러리
        <input type="file" accept="image/*" style="display:none" onchange="kbFileSelected(this,'gallery')">
      </label>
    </div>
  </div>
  <!-- 첨부 파일 미리보기 -->
  <div id="kb-attachments" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
</div>

<script>
// ── 키패드 위 고정 입력바 ──
var _kbTarget=null;      // 연결된 textarea
var _kbHasAttach=false;  // + 버튼 표시 여부
var _kbAttachOpen=false;
var _kbRecognizing=false;
var _kbAttachList=[];    // 첨부 파일 목록

// pp-root 내 동적 팝업에서 fta/contenteditable 감지
(function(){
  var ppObs=new MutationObserver(function(){
    var ppRoot=document.getElementById('pp-root');
    if(!ppRoot) return;
    ppRoot.querySelectorAll('.fta,[contenteditable="true"]').forEach(function(el){
      if(el._kbPpBound) return;
      el._kbPpBound=true;
      el.addEventListener('focus',function(){
        _kbTarget=el;
        _kbIsContent=el.getAttribute('contenteditable')==='true';
        _kbHasAttach=true; // 팝업 내부는 항상 + 표시
        kbShow();
      });
      el.addEventListener('blur',function(){
        setTimeout(function(){
          var active=document.activeElement;
          var bar=document.getElementById('kb-bar');
          if(bar&&bar.contains(active)) return;
          kbHide();
        },200);
      });
    });
  });
  ppObs.observe(document.body,{childList:true,subtree:true});
})();

// .fta textarea 또는 팝업 내 contenteditable focus 시 입력바 활성화
document.addEventListener('focusin',function(e){
  var el=e.target;
  var isFta=el.classList&&el.classList.contains('fta');
  var isContent=el.getAttribute&&el.getAttribute('contenteditable')==='true';
  if(!isFta&&!isContent) return;
  _kbTarget=el;
  _kbIsContent=isContent;
  var ppRoot=document.getElementById('pp-root');
  _kbHasAttach=ppRoot&&ppRoot.contains(el);
  kbShow();
});

document.addEventListener('focusout',function(e){
  var el=e.target;
  var isFta=el.classList&&el.classList.contains('fta');
  var isContent=el.getAttribute&&el.getAttribute('contenteditable')==='true';
  if(!isFta&&!isContent) return;
  setTimeout(function(){
    var active=document.activeElement;
    var bar=document.getElementById('kb-bar');
    if(bar&&bar.contains(active)) return;
    if(active&&active.classList&&active.classList.contains('fta')) return;
    if(active&&active.getAttribute&&active.getAttribute('contenteditable')==='true') return;
    kbHide();
  },200);
});

function kbShow(){
  var bar=document.getElementById('kb-bar');
  var inp=document.getElementById('kb-input');
  var attachBtn=document.getElementById('kb-attach-btn');
  if(!bar||!inp) return;
  // 현재 값 동기화 — contenteditable이면 innerText 사용
  var curVal=_kbTarget?(_kbIsContent?(_kbTarget.innerText||''):(_kbTarget.value||'')):'';
  inp.value=curVal;
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,120)+'px';
  // + 버튼 표시/숨김
  attachBtn.style.display=_kbHasAttach?'flex':'none';
  bar.style.display='block';
  kbPosition();
}

function kbHide(){
  var bar=document.getElementById('kb-bar');
  if(bar) bar.style.display='none';
  _kbAttachOpen=false;
  var sheet=document.getElementById('kb-attach-sheet');
  if(sheet) sheet.style.display='none';
}

function kbPosition(){
  if(!window.visualViewport) return;
  var bar=document.getElementById('kb-bar');
  if(!bar) return;
  var vv=window.visualViewport;
  var offsetBottom=window.innerHeight-(vv.offsetTop+vv.height);
  bar.style.bottom=Math.max(offsetBottom,0)+'px';
}

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',kbPosition);
  window.visualViewport.addEventListener('scroll',kbPosition);
}

function kbResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
  if(_kbTarget){
    if(_kbIsContent){
      _kbTarget.innerText=el.value;
    } else {
      _kbTarget.value=el.value;
    }
  }
}

function kbConfirm(){
  var inp=document.getElementById('kb-input');
  if(_kbTarget){
    if(_kbIsContent){
      _kbTarget.innerText=inp.value; // contenteditable
    } else {
      _kbTarget.value=inp.value; // textarea
    }
  }
  kbHide();
  if(_kbTarget) _kbTarget.blur();
}

function kbAttach(){
  _kbAttachOpen=!_kbAttachOpen;
  var sheet=document.getElementById('kb-attach-sheet');
  if(sheet) sheet.style.display=_kbAttachOpen?'block':'none';
}

function kbFileSelected(input,type){
  var files=input.files;
  if(!files||!files.length) return;
  var attEl=document.getElementById('kb-attachments');
  for(var i=0;i<files.length;i++){
    var f=files[i];
    _kbAttachList.push({file:f,type:type});
    var item=document.createElement('div');
    item.style.cssText='display:flex;align-items:center;gap:5px;background:#243045;border:1px solid #2d3f5a;border-radius:6px;padding:4px 8px;font-size:11px;color:#94a3b8';
    var icon=type==='file'?'📁':'🖼️';
    item.innerHTML=icon+' <span style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+f.name+'</span>'
      +'<button onclick="this.parentNode.remove()" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:13px;padding:0;margin-left:2px">×</button>';
    attEl.appendChild(item);
  }
  // 시트 닫기
  _kbAttachOpen=false;
  var sheet=document.getElementById('kb-attach-sheet');
  if(sheet) sheet.style.display='none';
}

function kbVoice(){
  var SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRec){toast('warn','음성 인식','이 브라우저에서는 지원되지 않습니다');return;}
  if(_kbRecognizing) return;
  var rec=new SpeechRec();
  rec.lang='ko-KR';
  rec.interimResults=false;
  rec.maxAlternatives=1;
  _kbRecognizing=true;
  var voiceBtn=document.getElementById('kb-voice-btn');
  if(voiceBtn){voiceBtn.style.background='#f87171';voiceBtn.style.color='#fff';}
  rec.onresult=function(e){
    var text=e.results[0][0].transcript;
    var inp=document.getElementById('kb-input');
    inp.value=(inp.value?inp.value+' ':'')+text;
    kbResize(inp);
    if(_kbTarget) _kbTarget.value=inp.value;
  };
  rec.onend=function(){
    _kbRecognizing=false;
    if(voiceBtn){voiceBtn.style.background='#243045';voiceBtn.style.color='#94a3b8';}
  };
  rec.onerror=function(){
    _kbRecognizing=false;
    if(voiceBtn){voiceBtn.style.background='#243045';voiceBtn.style.color='#94a3b8';}
    toast('warn','음성 인식','다시 시도해 주세요');
  };
  rec.start();
}
</script>
<script>
(function(){
  function onFocusInput(e){
    var el=e.target;
    setTimeout(function(){
      // 팝업 내부 input인지 확인
      var ppRoot=document.getElementById('pp-root');
      var inPopup=ppRoot&&ppRoot.contains(el);
      if(inPopup){
        // 팝업 내부: 팝업 스크롤 컨테이너 내에서만 스크롤
        var scrollParent=el.closest('.pp')||el.closest('.ov');
        if(scrollParent){
          el.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      } else {
        // 일반 화면: 화면 중앙으로 스크롤
        el.scrollIntoView({behavior:'smooth',block:'center'});
      }
    },300);
  }

  var observer=new MutationObserver(function(){
    document.querySelectorAll('input,textarea,select').forEach(function(el){
      if(el._kbBound) return;
      el._kbBound=true;
      el.addEventListener('focus',onFocusInput);
    });
  });
  observer.observe(document.body,{childList:true,subtree:true});

  // visualViewport: 키패드 올라올 때 현재 focused 요소 재조정 + 팝업 높이 조정
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){
      // 팝업 높이 동적 조정
      var ppRoot=document.getElementById('pp-root');
      if(ppRoot&&ppRoot.style.pointerEvents==='auto'){
        var vh=window.visualViewport.height;
        var ppEl=ppRoot.querySelector('.pp');
        if(ppEl) ppEl.style.maxHeight=(vh*0.92)+'px';
      }
      // focused 요소 스크롤
      var el=document.activeElement;
      if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')) return;
      var inPopup=ppRoot&&ppRoot.contains(el);
      setTimeout(function(){
        if(inPopup){
          el.scrollIntoView({behavior:'smooth',block:'nearest'});
        } else {
          el.scrollIntoView({behavior:'smooth',block:'center'});
        }
      },100);
    });
  }
})();
</script>
