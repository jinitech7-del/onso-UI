<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ACRM Cloud v8.3 — 고객관리</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;height:-webkit-fill-available}
body{height:100%;height:-webkit-fill-available;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;background:#0d1117;color:#e6edf3;overflow:hidden;display:flex;flex-direction:column}

/* 상단 컨트롤 바 */
#top-bar{background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;overflow:visible;display:flex;flex-direction:column}
#top-row1{height:40px;display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid #21262d;flex-shrink:0}
#top-row2{height:32px;display:flex;align-items:center;padding:0 12px;flex-shrink:0}
#compare-wrap{display:flex;flex:1;min-height:0;overflow:hidden}
.view-tabs{display:flex;gap:3px}
.v-btn{width:24px;height:24px;border-radius:5px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;transition:all .15s;display:flex;align-items:center;justify-content:center;padding:0}
.v-btn:hover{background:#21262d;color:#e6edf3}
.v-btn.on{background:#21262d;color:#e6edf3;border-color:#484f58}
/* AI 사이드바 버튼 */
.ai-btn-free{width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;background:#141e2d;border:1px solid #1e2e42;color:#e2e8f0;font-size:11px;cursor:pointer;font-family:inherit;transition:border-color .15s}
.ai-btn-free:hover{border-color:#7B74E0}
.ai-free-badge{font-size:9px;padding:1px 6px;border-radius:8px;background:rgba(72,199,142,.12);color:#48c78e;border:1px solid rgba(72,199,142,.3)}
.ai-btn-credit{width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;background:#141e2d;border:1px solid #1e2e42;color:#e2e8f0;font-size:11px;cursor:pointer;font-family:inherit;transition:border-color .15s}
.ai-btn-credit:hover{border-color:#9C96EA}
.ai-credit-badge{font-size:9px;padding:1px 7px;border-radius:8px;background:rgba(123,116,224,.15);color:#9C96EA;border:1px solid rgba(123,116,224,.35)}
.ai-streaming{animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.theme-icon-group{display:flex;gap:3px}
.theme-icon-btn{width:24px;height:24px;border-radius:5px;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:#8b949e}
.theme-icon-btn:hover{color:#e6edf3;background:#21262d}
.theme-icon-btn.on{color:#58a6ff;background:#21262d;border-color:#30363d}
.bell-wrap{position:relative;cursor:pointer;display:flex;align-items:center;color:#8b949e}
.bell-wrap:hover{color:#e6edf3}
.bell-badge{position:absolute;top:-4px;right:-5px;width:13px;height:13px;border-radius:50%;background:#FF4D4D;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #161b22}
.user-info{display:flex;align-items:center;gap:5px;margin-left:auto;color:#8b949e;cursor:pointer}
.user-info:hover{color:#e6edf3}
.user-name{font-size:11px;font-weight:600;color:#e6edf3}
.role-dropdown-wrap{position:relative}
.role-dropdown-btn{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;border:1px solid #30363d;background:#21262d;color:#e6edf3;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;height:24px}
.role-dropdown-btn:hover{border-color:#58a6ff;color:#58a6ff}
.role-dropdown-btn:hover svg{color:#58a6ff}
.role-dropdown-btn svg{color:#8b949e;transition:color .15s;flex-shrink:0}
.role-dropdown-menu{display:none;position:absolute;top:calc(100% + 5px);left:0;background:#1c2230;border:1px solid #30363d;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:999;min-width:120px;padding:4px}
.role-dropdown-menu.open{display:block}
.role-option{padding:7px 12px;font-size:11px;color:#8b949e;cursor:pointer;border-radius:5px;font-family:inherit;transition:all .15s;white-space:nowrap}
.role-option:hover{background:#253553;color:#e6edf3}
.role-option.on{color:#58a6ff;font-weight:600;background:rgba(45,126,248,0.1)}
@media(max-width:767px){#view-tabs-pc{display:none!important}}
.bell-badge{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#FF4D4D;font-size:8px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #161b22}
/* 2줄 요소 */
.row2-label{font-size:12px;font-weight:700;color:#e6edf3;padding-right:10px;white-space:nowrap}
.row2-sep{width:1px;height:14px;background:#30363d;margin-right:10px;flex-shrink:0}
/* 드롭다운 */
.role-dropdown-wrap{position:relative}
.role-dropdown-btn{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#e6edf3;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.role-dropdown-btn:hover{border-color:#58a6ff;color:#58a6ff}
.role-dropdown-btn:hover svg{stroke:#58a6ff}
.role-dropdown-btn svg{color:#8b949e;transition:all .15s;flex-shrink:0}
.role-dropdown-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#1c2230;border:1px solid #30363d;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:999;min-width:120px;overflow:hidden;padding:4px}
.role-dropdown-menu.open{display:block}
.role-option{padding:7px 12px;font-size:11px;color:#8b949e;cursor:pointer;border-radius:5px;font-family:inherit;transition:all .15s;white-space:nowrap}
.role-option:hover{background:#253553;color:#e6edf3}
.role-option.on{color:#58a6ff;font-weight:600;background:rgba(45,126,248,0.1)}
#top-bar .logo{font-size:13px;font-weight:800;color:#58a6ff;letter-spacing:-.5px;white-space:nowrap}
#top-bar .sep{width:1px;height:20px;background:#30363d;flex-shrink:0}
#top-bar .lbl{font-size:11px;color:#8b949e;white-space:nowrap}
.theme-toggle{display:flex;gap:4px}
.t-btn{padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;font-family:inherit;transition:all .15s;white-space:nowrap}
.t-btn.on{border-color:#58a6ff;background:rgba(88,166,255,0.1);color:#58a6ff;font-weight:600}
.view-tabs{display:flex;gap:4px;margin-left:auto}
.v-btn{width:26px;height:26px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #30363d;background:transparent;color:#8b949e;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;padding:0}
.v-btn.on{background:#21262d;color:#e6edf3;border-color:#484f58}

/* 레이아웃 */
#pc-panel{flex:1;min-width:0;display:flex;flex-direction:column;border-right:2px solid #21262d;overflow:hidden}
#pc-panel.hidden,#mob-panel.hidden{display:none}
.panel-label{height:28px;display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:600;letter-spacing:.5px;flex-shrink:0}
#pc-panel .panel-label{background:#161b22;color:#58a6ff;border-bottom:1px solid #21262d}
#mob-panel .panel-label{background:#161b22;color:#3fb950;border-bottom:1px solid #21262d}
#pc-inner{flex:1;overflow:hidden;display:flex}
#mob-panel{width:400px;min-width:400px;display:flex;flex-direction:column;background:#0d1117}
#mob-panel.full{width:100%;min-width:0;align-items:stretch}
#mob-panel.full #mob-inner{padding:0}
#mob-panel.full .phone-frame{max-width:100%;border-radius:0;box-shadow:none;max-height:100%}
#mob-inner{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px 20px}
.phone-frame{width:100%;max-width:360px;height:100%;max-height:760px;background:#0B0F1A;border-radius:36px;box-shadow:0 0 0 9px #1c2028,0 0 0 11px #2d333b,0 16px 48px rgba(0,0,0,.8);overflow:hidden;position:relative;display:flex;flex-direction:column}

/* 테마 변수 */
.theme-dark{--bg-base:#0B0F1A;--bg-surf:#111827;--bg-raise:#1A2235;--bg-over:#1F2D44;--bg-hover:#243350;--bd-sub:#1E2D45;--bd-def:#253553;--bd-str:#2E4268;--ac:#2D7EF8;--ac-glow:rgba(45,126,248,0.15);--tx:#E8EDF5;--tx2:#8DA0BC;--txm:#4F6380;--logo1:#1A56DB;--logo2:#2D7EF8;--green:#2ECC8A;--orange:#FF8C42;--red:#FF4D4D;--yellow:#E0B800;--purple:#B47FFF}
.theme-white{--bg-base:#F0F2F5;--bg-surf:#FFFFFF;--bg-raise:#F8F9FB;--bg-over:#EEF1F6;--bg-hover:#E4E8F0;--bd-sub:#E2E8F0;--bd-def:#CBD5E1;--bd-str:#94A3B8;--ac:#1D4ED8;--ac-glow:rgba(29,78,216,0.10);--tx:#0F172A;--tx2:#475569;--txm:#94A3B8;--logo1:#1D4ED8;--logo2:#3B82F6;--green:#16A34A;--orange:#EA580C;--red:#DC2626;--yellow:#CA8A04;--purple:#7C3AED}
.theme-pink{--bg-base:#FDF0F5;--bg-surf:#FFF5F8;--bg-raise:#FFE8F0;--bg-over:#FDDDE8;--bg-hover:#FBCFDF;--bd-sub:#FACCD8;--bd-def:#F9A8C4;--bd-str:#F472A8;--ac:#DB2777;--ac-glow:rgba(219,39,119,0.12);--tx:#1E0A10;--tx2:#6B2242;--txm:#C07090;--logo1:#DB2777;--logo2:#F472B6;--green:#15803D;--orange:#C2410C;--red:#B91C1C;--yellow:#A16207;--purple:#6D28D9}

/* PC 사이드바 */
.pc-screen{display:flex;width:100%;height:100%;overflow:hidden;font-size:12px}
.pc-sidebar{width:190px;min-width:190px;height:100%;background:var(--bg-surf);border-right:1px solid var(--bd-sub);display:flex;flex-direction:column;overflow:hidden}
.pc-logo{padding:16px 14px 12px;border-bottom:1px solid var(--bd-sub);display:flex;align-items:center;gap:9px;flex-shrink:0}
.pc-logo-box{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--logo1),var(--logo2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.pc-logo-name{font-size:12px;font-weight:700;color:var(--tx)}
.pc-logo-ver{font-size:11px;color:var(--txm);margin-top:1px}
.pc-nav{flex:1;overflow-y:auto;padding:6px 0}
.pc-nav::-webkit-scrollbar{width:2px}
.pc-nav::-webkit-scrollbar-thumb{background:var(--bd-str)}
.pc-nav-sep{height:1px;margin:5px 10px;background:var(--bd-sub)}
.pc-nav-item{display:flex;align-items:center;gap:7px;padding:6px 11px;cursor:pointer;border-radius:5px;margin:1px 4px;border-left:2px solid transparent;transition:background .1s}
.pc-nav-item:hover{background:var(--bg-hover)}
.pc-nav-item.active{background:var(--ac-glow);border-left-color:var(--ac)}
.pc-nav-label{font-size:11.5px;flex:1;color:var(--tx2)}
.pc-nav-item.active .pc-nav-label{color:var(--ac);font-weight:600}
.pc-sub{padding-left:26px}
.pc-sub-item{padding:4px 8px;font-size:11px;cursor:pointer;color:var(--txm);border-left:1px solid transparent;border-radius:3px;margin:1px 0}
.pc-sub-item:hover{background:var(--bg-hover);color:var(--tx2)}
.pc-sub-item.active{color:var(--tx);font-weight:500;border-left-color:var(--ac);background:var(--ac-glow)}
.pc-user{padding:10px 12px;border-top:1px solid var(--bd-sub);display:flex;align-items:center;gap:8px;flex-shrink:0}
.pc-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--logo1),var(--logo2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.pc-user-name{font-size:11px;font-weight:600;color:var(--tx)}
.pc-user-role{font-size:11px;color:var(--txm)}

/* PC 메인 */
.pc-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-base)}
.pc-topbar{height:46px;background:var(--bg-surf);border-bottom:1px solid var(--bd-sub);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.pc-breadcrumb{flex:1;font-size:10px;color:var(--txm);display:flex;align-items:center;gap:4px}
.pc-breadcrumb span{color:var(--tx);font-weight:600}
.pc-search{display:flex;align-items:center;gap:6px;background:var(--bg-raise);border:1px solid var(--bd-def);border-radius:5px;padding:5px 10px;width:170px}
.pc-search input{background:none;border:none;outline:none;font-size:13px;color:var(--tx);width:100%;font-family:inherit}
.pc-search input::placeholder{color:var(--txm)}
.pc-new-btn{display:flex;align-items:center;gap:4px;background:var(--ac);color:#fff;border:none;border-radius:5px;padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* PC 통계 카드 */
.pc-stats{display:flex;gap:10px;padding:12px 14px;flex-shrink:0}
.pc-stat{flex:1;background:var(--bg-raise);border:1px solid var(--bd-sub);border-radius:7px;padding:10px 12px;border-top-width:2px;border-top-style:solid}
.pc-stat-lbl{font-size:11px;color:var(--txm);margin-bottom:3px}
.pc-stat-val{font-size:17px;font-weight:700;font-family:monospace}
.pc-stat-sub{font-size:11px;color:var(--txm);margin-top:3px}

/* PC 필터 */
.pc-filter-row{display:flex;gap:4px;padding:0 14px 8px;flex-shrink:0;flex-wrap:wrap;align-items:center}
.pc-chip{padding:3px 8px;border-radius:3px;font-size:10px;cursor:pointer;border:1px solid var(--bd-sub);background:transparent;color:var(--txm);font-family:inherit;transition:all .15s}
.pc-chip:hover{border-color:var(--bd-str);color:var(--tx2)}
.pc-chip.on{border-color:var(--ac);background:var(--ac-glow);color:var(--ac);font-weight:600}

/* PC 테이블 */
.pc-table-wrap{flex:1;overflow:auto;display:flex}
.pc-table-area{flex:1;overflow:auto}
.pc-table{width:100%;border-collapse:collapse;font-size:11px}
.pc-table thead tr{background:var(--bg-base);position:sticky;top:0;z-index:1}
.pc-table th{padding:7px 10px;text-align:left;color:var(--txm);font-weight:500;font-size:10px;border-bottom:1px solid var(--bd-sub);white-space:nowrap}
.pc-table td{padding:7px 10px;border-bottom:1px solid var(--bd-sub);vertical-align:middle}
.pc-table tr:hover td{background:var(--bg-hover)}
.pc-table tr.sel td{background:var(--ac-glow)}
.pc-table tr.sel{border-left:3px solid var(--ac)}

/* PC 우측 패널 */
.pc-right{width:280px;min-width:280px;background:var(--bg-surf);border-left:1px solid var(--bd-sub);display:flex;flex-direction:column;overflow:hidden}
.pc-right-header{padding:12px 14px;border-bottom:1px solid var(--bd-sub);background:var(--bg-raise)}
.pc-right-name{font-size:12px;font-weight:700;color:var(--tx);line-height:1.4;margin-bottom:5px}
.pc-right-section{padding:10px 14px;border-bottom:1px solid var(--bd-sub)}
.pc-right-sec-title{font-size:11px;font-weight:600;color:var(--txm);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
.pc-metric-row{display:flex;justify-content:space-between;padding:3px 0}
.pc-metric-lbl{font-size:11px;color:var(--txm)}
.pc-metric-val{font-size:11px;font-weight:600;font-family:monospace}
.pc-act-row{display:flex;gap:7px;align-items:center;padding:3px 0}
.pc-act-icon{width:20px;height:20px;border-radius:50%;background:var(--bg-over);border:1px solid var(--bd-def);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pc-act-desc{font-size:10.5px;color:var(--tx2)}
.pc-act-date{font-size:9px;color:var(--txm)}
.pc-right-actions{padding:12px 14px;margin-top:auto}
.pc-btn-p{width:100%;padding:7px;border-radius:5px;border:none;background:var(--ac);color:#fff;font-size:11px;font-weight:600;cursor:pointer;margin-bottom:5px;font-family:inherit}
.pc-btn-g{width:100%;padding:7px;border-radius:5px;background:transparent;color:var(--ac);border:1px solid var(--bd-def);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px}

/* 대시보드 전용 */
.dash-grid{display:grid;gap:12px;padding:14px;overflow-y:auto;flex:1}
.dash-grid.g2{grid-template-columns:1fr 1fr}
.dash-grid.g3{grid-template-columns:1fr 1fr 1fr}
.dash-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr}
.dash-card{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:14px;overflow:hidden}
.dash-card-title{font-size:10px;font-weight:600;color:var(--txm);margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.dash-card-title .badge{font-size:9px;color:var(--tx2);background:var(--bg-raise);border:1px solid var(--bd-sub);padding:1px 6px;border-radius:3px;text-transform:none;letter-spacing:0}

/* 파이프라인 바 */
.pipe-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pipe-lbl{font-size:11px;color:var(--tx2);width:42px;flex-shrink:0}
.pipe-bg{flex:1;height:5px;background:var(--bg-over);border-radius:3px;overflow:hidden}
.pipe-fill{height:100%;border-radius:3px;transition:width .5s ease}
.pipe-cnt{font-size:11px;color:var(--tx2);width:22px;text-align:right;flex-shrink:0}
.pipe-amt{font-size:11px;color:var(--txm);width:58px;text-align:right;flex-shrink:0;font-family:monospace}

/* 막대 차트 */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:70px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .5s}
.bar-lbl{font-size:11px;color:var(--txm)}

/* 수주가능성 바 */
.prob-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;background:var(--bg-raise);margin-bottom:5px;cursor:pointer;transition:background .15s}
.prob-row:hover{background:var(--bg-over)}
.prob-name{font-size:11px;color:var(--tx);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob-bg{width:70px;height:4px;background:var(--bg-base);border-radius:2px;overflow:hidden;flex-shrink:0}
.prob-fill{height:100%;border-radius:2px}
.prob-pct{font-size:11px;font-weight:700;width:30px;text-align:right;flex-shrink:0;font-family:monospace}

/* 목표 달성 */
.goal-bar-bg{width:100%;height:7px;background:var(--bg-over);border-radius:4px;overflow:hidden;margin:8px 0}
.goal-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--green))}
.goal-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.goal-stat{background:var(--bg-raise);border:1px solid var(--bd-sub);border-radius:6px;padding:8px;text-align:center}
.goal-stat-val{font-size:16px;font-weight:700;font-family:monospace}
.goal-stat-lbl{font-size:11px;color:var(--txm);margin-top:2px}

/* 오늘 할 일 */
.todo-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--bd-sub);cursor:pointer}
.todo-item:last-child{border-bottom:none}
.todo-check{width:14px;height:14px;border:2px solid var(--bd-str);border-radius:3px;flex-shrink:0;margin-top:2px}
.todo-title{font-size:11px;color:var(--tx);font-weight:500;line-height:1.4}
.todo-sub{font-size:11px;color:var(--txm);margin-top:2px}
.todo-time{font-size:10px;color:var(--tx2);flex-shrink:0;white-space:nowrap}

/* 임박 알림 */
.alert-item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:7px;margin-bottom:6px;cursor:pointer;border-left:3px solid transparent}
.alert-item:hover{filter:brightness(1.1)}
.alert-item.red{background:rgba(255,77,77,.06);border-left-color:var(--red)}
.alert-item.orange{background:rgba(255,140,66,.06);border-left-color:var(--orange)}
.alert-item.blue{background:rgba(45,126,248,.06);border-left-color:var(--ac)}
.alert-title{font-size:11px;color:var(--tx);font-weight:500}
.alert-sub{font-size:11px;color:var(--txm);margin-top:2px}

.rep-cnt{font-size:10px;color:var(--txm);width:30px;flex-shrink:0}
.rep-bg{flex:1;height:4px;background:var(--bg-over);border-radius:2px;overflow:hidden}

/* 발주관리 테이블 */

/* 모바일 공통 */

.mob-logo-box{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--logo1),var(--logo2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.mob-header-title{flex:1;font-size:13px;font-weight:700;color:var(--tx)}
.mob-theme-btns{display:flex;gap:4px}
.mob-t-btn{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd-def);background:var(--bg-raise);cursor:pointer;display:flex;align-items:center;justify-content:center}

.mob-bell{position:relative;cursor:pointer}
.mob-bell-dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#FF4D4D;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-surf)}

.mob-page-title-sub{font-size:11px;color:var(--txm);margin-top:1px}
.mob-content{flex:1;overflow-y:auto;padding:10px 12px 12px;-webkit-overflow-scrolling:touch}
.mob-tabbar{position:relative;height:56px;background:var(--bg-surf);border-top:1px solid var(--bd-sub);display:flex;z-index:200;flex-shrink:0}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;border-top:2px solid transparent}

.mob-tab-lbl{font-size:11px;color:var(--txm);font-family:inherit}

.mob-dots{display:flex;gap:3px;align-items:center;height:16px}
.mob-dot{width:3px;height:3px;border-radius:50%;background:var(--txm)}

.mob-stat-row{display:flex;gap:5px;margin-bottom:9px}
.mob-stat-card{flex:1;background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:6px 8px;min-width:0;border-top-width:2px;border-top-style:solid}
.mob-stat-lbl{font-size:9px;color:var(--txm);margin-bottom:2px}
.mob-stat-val{font-size:14px;font-weight:700;font-family:monospace}
.mob-filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.mob-chip{padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1.5px solid var(--bd-sub);background:transparent;color:var(--txm);font-family:inherit}

.mob-search{display:flex;align-items:center;gap:7px;background:var(--bg-surf);border:1px solid var(--bd-def);border-radius:8px;padding:8px 11px;margin-bottom:9px}
.mob-search input{background:none;border:none;outline:none;font-size:14px;color:var(--tx);flex:1;font-family:inherit}
.mob-search input::placeholder{color:var(--txm)}
.mob-card-list{display:flex;flex-direction:column;gap:7px}
.mob-card{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:9px;padding:10px 12px;cursor:pointer;border-left-width:3px;border-left-style:solid;transition:background .15s}
.mob-card:hover{background:var(--bg-hover)}
.mob-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.mob-card-name{flex:1;font-size:11px;font-weight:600;color:var(--tx);margin-right:7px;line-height:1.3}
.mob-card-mid{font-size:10px;color:var(--txm);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mob-card-bot{display:flex;justify-content:space-between;align-items:center}
.mob-card-amt{font-size:11px;font-weight:700;color:var(--tx);font-family:monospace}
.mob-card-date{font-size:11px;color:var(--txm)}
.mob-badge{padding:2px 6px;border-radius:3px;font-size:11px;font-weight:700}
.mob-stage-badge{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap}
.mob-overlay{position:absolute;inset:0;bottom:56px;background:rgba(0,0,0,.45);z-index:150}
.mob-more-panel{position:absolute;bottom:56px;left:0;right:0;z-index:160;background:var(--bg-surf);border-radius:16px 16px 0 0;border-top:1px solid var(--bd-sub);box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.mob-more-handle{display:flex;justify-content:center;padding:10px 0 3px}
.mob-more-bar{width:32px;height:3px;border-radius:2px;background:var(--bd-str)}
.mob-more-title{padding:3px 14px 6px;font-size:10px;font-weight:600;color:var(--txm);letter-spacing:.4px}
.mob-more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 20px}
.mob-more-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:10px;border:none;cursor:pointer;background:var(--bg-raise)}
.mob-more-icon-box{width:38px;height:38px;border-radius:10px;background:var(--bg-over);border:1px solid var(--bd-sub);display:flex;align-items:center;justify-content:center}
.mob-more-lbl span{display:block;font-size:10px;font-weight:500;color:var(--tx2);text-align:center;line-height:1.35;font-family:inherit}
.mob-more-item.dim{opacity:.55}
.mob-more-badge{font-size:8px;color:var(--txm);border:1px solid var(--bd-def);padding:1px 4px;border-radius:3px;font-family:inherit}
.mob-detail-overlay{position:absolute;inset:0;z-index:300;display:flex;flex-direction:column}
.mob-detail-bg{flex:1;background:rgba(0,0,0,.5)}
.mob-detail-sheet{background:var(--bg-surf);border-radius:16px 16px 0 0;border-top:1px solid var(--bd-sub);max-height:80%;overflow-y:auto}
.mob-detail-handle{display:flex;justify-content:center;padding:10px 0 3px}
.mob-detail-body{padding:0 14px 20px}
.mob-detail-row{display:flex;padding:6px 0;border-bottom:1px solid var(--bd-sub)}
.mob-detail-lbl{width:65px;font-size:10px;color:var(--txm);flex-shrink:0}
.mob-detail-val{font-size:11px;color:var(--tx);font-weight:500}
.mob-action-btn{width:100%;padding:10px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:6px}
.mob-btn-p{background:var(--ac);color:#fff;border:none}
.mob-btn-g{background:transparent;color:var(--tx2);border:1px solid var(--bd-def)}
.mob-proj-detail{position:absolute;inset:0;background:var(--bg-base);z-index:250;overflow-y:auto;padding-bottom:60px}
.mob-proj-header{position:sticky;top:0;background:var(--bg-surf);border-bottom:1px solid var(--bd-sub);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:1}
.mob-back-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center}
.mob-proj-name{flex:1;font-size:12px;font-weight:700;color:var(--tx);line-height:1.3}
.mob-proj-cust{font-size:10px;color:var(--txm);margin-top:1px}
.mob-metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mob-metric-card{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:7px;padding:9px 10px}
.mob-metric-lbl{font-size:11px;color:var(--txm);margin-bottom:3px}
.mob-metric-val{font-size:13px;font-weight:700;font-family:monospace}
.mob-section-card{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:7px;padding:10px 12px;margin-bottom:12px}
.mob-section-title{font-size:10px;font-weight:600;color:var(--txm);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.mob-act-row{display:flex;gap:8px;padding:4px 0;align-items:center}
.mob-act-icon{width:22px;height:22px;border-radius:50%;background:var(--bg-over);border:1px solid var(--bd-def);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mob-act-desc{font-size:11px;color:var(--tx2)}
.mob-act-date{font-size:11px;color:var(--txm)}
.mob-empty{text-align:center;padding:36px 14px;color:var(--txm)}
.mob-empty-icon{display:flex;justify-content:center;margin-bottom:14px}
.mob-empty-title{font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.mob-empty-desc{font-size:11px}

/* 모바일 대시보드 전용 */
.mob-dash-section{margin-bottom:12px}
.mob-dash-section-title{font-size:10px;font-weight:600;color:var(--txm);margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.mob-dash-card{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.mob-pipe-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.mob-pipe-lbl{font-size:10px;color:var(--tx2);width:38px;flex-shrink:0}
.mob-pipe-bg{flex:1;height:4px;background:var(--bg-over);border-radius:2px;overflow:hidden}
.mob-pipe-fill{height:100%;border-radius:2px}
.mob-pipe-cnt{font-size:10px;color:var(--tx2);width:20px;text-align:right;flex-shrink:0}
.mob-alert-item{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border-radius:6px;margin-bottom:5px;border-left:2px solid transparent}
.mob-alert-item.red{background:rgba(255,77,77,.06);border-left-color:var(--red)}
.mob-alert-item.orange{background:rgba(255,140,66,.06);border-left-color:var(--orange)}
.mob-alert-item.blue{background:rgba(45,126,248,.06);border-left-color:var(--ac)}
.mob-todo-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd-sub)}
.mob-todo-item:last-child{border-bottom:none}
.mob-todo-check{width:13px;height:13px;border:2px solid var(--bd-str);border-radius:3px;flex-shrink:0;margin-top:2px}

/* ═══════════════════════════════════════════════════════
   모바일 최적화 — iPhone 16 Pro
═══════════════════════════════════════════════════════ */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
input, button, select, textarea { font-size: max(16px, 1em); }
/* iOS Safari 자동 확대 방지 */
@media screen and (-webkit-min-device-pixel-ratio: 0) {
  input, select, textarea { font-size: 16px; }
}

/* 추가 dim 변수 (통합 파일용) */
.theme-dark {
  --orange-dim: rgba(255,140,66,0.12);
  --green-dim: rgba(46,204,138,0.12);
  --red-dim: rgba(255,77,77,0.12);
  --purple-dim: rgba(180,127,255,0.12);
  --teal: #2DD4BF; --teal-dim: rgba(45,212,191,0.12);
  --yellow-dim: rgba(224,184,0,0.12);
}
.theme-white {
  --orange-dim: rgba(234,88,12,0.10);
  --green-dim: rgba(22,163,74,0.10);
  --red-dim: rgba(220,38,38,0.10);
  --purple-dim: rgba(124,58,237,0.10);
  --teal: #0D9488; --teal-dim: rgba(13,148,136,0.10);
  --yellow-dim: rgba(202,138,4,0.10);
}
.theme-pink {
  --orange-dim: rgba(194,65,12,0.12);
  --green-dim: rgba(21,128,61,0.12);
  --red-dim: rgba(185,28,28,0.12);
  --purple-dim: rgba(109,40,217,0.12);
  --teal: #0F766E; --teal-dim: rgba(15,118,110,0.12);
  --yellow-dim: rgba(161,98,7,0.12);
}

/* 통합 공통 컴포넌트 */
.view-tabs { display:flex; background:var(--bg-raise); border-radius:7px; padding:2px; gap:2px; }
.view-tab { padding:5px 16px; border-radius:5px; font-size:11px; cursor:pointer; color:var(--tx2); transition:all 0.15s; }
.view-tab.active { background:var(--bg-over); color:var(--tx); font-weight:600; }
.btn { padding:6px 14px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; border:none; font-family:inherit; transition:all 0.15s; }
.btn-primary { background:var(--ac); color:white; }
.btn-ghost { background:var(--bg-raise); color:var(--tx2); border:1px solid var(--bd-def); }
.btn-ghost:hover { border-color:var(--ac); color:var(--ac); }
.btn-green { background:var(--green); color:#fff; }
.btn-orange { background:var(--orange); color:#fff; }
.btn-red { background:var(--red); color:#fff; }
.chip { font-size:10px; padding:2px 7px; border-radius:10px; font-weight:500; }
.chip-orange { background:var(--orange-dim); color:var(--orange); }
.chip-green { background:var(--green-dim); color:var(--green); }
.chip-blue { background:var(--ac-glow); color:var(--ac); }
.chip-red { background:var(--red-dim); color:var(--red); }
.chip-purple { background:var(--purple-dim); color:var(--purple); }
.chip-gray { background:var(--bg-over); color:var(--tx2); }
.chip-teal { background:var(--teal-dim); color:var(--teal); }
.badge { padding:2px 7px; border-radius:10px; font-size:10px; font-weight:600; }
.page-title { font-size:15px; font-weight:700; color:var(--tx); }

/* ── 통합 PC 콘텐츠 영역 ── */
.intg-wrap { display:flex; width:100%; height:100%; overflow:hidden; background:var(--bg-base); }
.intg-left { width:220px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--bd-def); overflow:hidden; background:var(--bg-surf); }
.intg-center { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.intg-right { width:280px; flex-shrink:0; display:flex; flex-direction:column; border-left:1px solid var(--bd-def); overflow:hidden; }
.intg-header { padding:14px 16px; border-bottom:1px solid var(--bd-def); background:var(--bg-surf); flex-shrink:0; }
.intg-header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.intg-content { flex:1; overflow-y:auto; }

/* ── 팝업 오버레이 ── */
.intg-popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:500; display:flex; align-items:center; justify-content:center; }
.intg-popup-overlay.hidden { display:none; }

/* ── 프로젝트 상세 탭 ── */
.detail-header { background:var(--bg-surf); border-bottom:1px solid var(--bd-def); padding:14px 20px; flex-shrink:0; }
.breadcrumb { font-size:11px; color:var(--txm); margin-bottom:8px; display:flex; align-items:center; gap:4px; }
.breadcrumb a { color:var(--ac); cursor:pointer; }
.breadcrumb .bc-link { color:var(--ac); cursor:pointer; }
.header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.project-title { font-size:18px; font-weight:800; color:var(--tx); }
.header-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:5px; }
.meta-item { font-size:11px; color:var(--txm); }
.meta-item strong { color:var(--tx2); }
.header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.detail-tabs { display:flex; border-bottom:1px solid var(--bd-def); background:var(--bg-surf); flex-shrink:0; padding:0 20px; overflow-x:auto; }
.detail-tab { padding:10px 16px; font-size:11px; font-weight:500; color:var(--tx2); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all .15s; }
.detail-tab.active { color:var(--ac); border-bottom-color:var(--ac); font-weight:600; }
.detail-body { flex:1; overflow-y:auto; padding:16px 20px; }

/* ── 활동 캘린더 ── */
.center-header { padding:14px 16px; border-bottom:1px solid var(--bd-def); background:var(--bg-surf); flex-shrink:0; }
.center-header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.calendar-wrap { flex:1; overflow:hidden; display:flex; flex-direction:column; padding:14px; }
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0; }
.cal-nav { display:flex; align-items:center; gap:6px; }
.cal-nav-btn { width:26px; height:26px; border-radius:5px; background:var(--bg-raise); border:1px solid var(--bd-def); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--tx2); }
.cal-month { font-size:14px; font-weight:700; color:var(--tx); min-width:90px; text-align:center; }
.cal-legend { display:flex; gap:12px; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--tx2); }
.legend-dot { width:7px; height:7px; border-radius:50%; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-day-header { text-align:center; font-size:10px; color:var(--txm); padding:4px 0; font-weight:600; }
.cal-day-header.sun { color:var(--red); }
.cal-day-header.sat { color:var(--ac); }
.cal-cell { min-height:72px; background:var(--bg-surf); border:1px solid var(--bd-def); border-radius:5px; padding:5px; cursor:pointer; transition:background .15s; }
.cal-cell:hover { background:var(--bg-raise); }
.cal-cell.other-month { opacity:.4; }
.cal-cell.today { border-color:var(--ac); }
.cal-date-wrap { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.cal-date { font-size:11px; font-weight:600; color:var(--tx2); }
.cal-cell.today .cal-date { width:18px; height:18px; background:var(--ac); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; }
.cal-events { display:flex; flex-direction:column; gap:2px; }
.cal-event { font-size:11px; padding:2px 5px; border-radius:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }

/* ── PSR 분석 ── */
.left-panel { width:280px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--bd-def); overflow:hidden; }
.center-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.panel-header { padding:14px 14px 10px; border-bottom:1px solid var(--bd-def); flex-shrink:0; }
.panel-header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.panel-title { font-size:13px; font-weight:700; color:var(--tx); }
.list-wrap { flex:1; overflow-y:auto; }
.center-content { flex:1; overflow-y:auto; padding:16px; }
.conflict-card { background:var(--bg-surf); border:1px solid var(--red); border-radius:8px; padding:14px; margin-bottom:10px; }
.conflict-title { font-size:12px; font-weight:700; color:var(--tx); margin-bottom:4px; }
.conflict-sub { font-size:10px; color:var(--tx2); }

.data-table { width:100%; border-collapse:collapse; font-size:11px; }

.state-pending { background:var(--orange-dim); color:var(--orange); }

.bdg { padding:2px 7px; border-radius:3px; font-size:9px; font-weight:600; }

/* ── 변경이력 탭 ── */
.filter-tabs { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
.filter-tab { padding:4px 12px; border-radius:20px; font-size:11px; cursor:pointer; border:1px solid var(--bd-def); background:transparent; color:var(--tx2); font-family:inherit; transition:all .15s; }

.date-label { font-size:10px; color:var(--txm); font-weight:600; white-space:nowrap; }
.history-item { background:var(--bg-surf); border:1px solid var(--bd-def); border-radius:8px; padding:12px 14px; margin-bottom:8px; }

.change-before { background:var(--red-dim); border:1px solid var(--red); border-radius:5px; padding:6px 10px; font-size:10px; color:var(--red); }
.change-after { background:var(--green-dim); border:1px solid var(--green); border-radius:5px; padding:6px 10px; font-size:10px; color:var(--green); }

.change-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:10px; }
.change-table th { padding:5px 8px; text-align:left; color:var(--txm); border-bottom:1px solid var(--bd-def); }
.change-table td { padding:5px 8px; border-bottom:1px solid var(--bd-def); }
.audit-notice { background:var(--ac-glow); border:1px solid var(--ac); border-radius:6px; padding:8px 12px; font-size:10px; color:var(--ac); margin-bottom:12px; }

/* ── 팝업 ── */
.popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:500; display:none; align-items:center; justify-content:center; }
.popup-overlay.open { display:flex; }

/* ════ 팝업 시스템 v8 ════ */

/* 모바일 고객 */
.mob-cust-card{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:9px;padding:10px 12px;cursor:pointer;border-left-width:3px;border-left-style:solid;margin-bottom:7px;transition:background .1s}
.mob-cust-detail{position:absolute;inset:0;background:var(--bg-base);z-index:200;overflow:hidden;display:flex;flex-direction:column}
.mob-cust-detail-hd{background:var(--bg-surf);border-bottom:1px solid var(--bd-sub);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.mob-cust-tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg-surf);border-bottom:1px solid var(--bd-sub);flex-shrink:0}
.mob-cust-tab-btn{padding:0 14px;height:38px;border:none;border-bottom:2px solid transparent;background:transparent;font-size:11px;font-weight:500;color:var(--txm);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
.mob-cust-tab-btn.on{border-bottom-color:var(--ac);color:var(--ac);font-weight:700}
.mob-cust-body{flex:1;overflow-y:auto;padding:12px 14px 80px}
.mob-cust-info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd-sub);font-size:11px}
.mob-cust-contact{background:var(--bg-surf);border:1px solid var(--bd-sub);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.mob-cust-action-row{display:flex;gap:6px;margin-top:8px}
.mob-cust-btn{flex:1;padding:7px;border-radius:6px;border:1px solid var(--bd-def);background:var(--bg-over);color:var(--tx2);font-size:11px;cursor:pointer;text-align:center;font-family:inherit}
.mob-cust-btn-p{background:var(--ac);border-color:var(--ac);color:#fff}
.mob-proc-item{padding:7px 0;border-bottom:1px solid var(--bd-sub);font-size:11px}

/* ── 전체 다크 스크롤바 ─────────────────────── */
*{scrollbar-width:thin;scrollbar-color:#2d3748 transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2d3748;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#4a5568}
::-webkit-scrollbar-corner{background:transparent}
/* 리사이저 핸들 다크 스타일 */
#cust-resizer{background:transparent!important;border:none}
#cust-resizer:hover span{background:var(--ac)!important}
/* 범위 선택/드래그 핸들 다크 */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-track{background:#2d3748;height:4px;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ac);cursor:pointer}
/* 모달/팝업 스크롤 */
.pp-bd::-webkit-scrollbar{width:4px}
.pp-bd::-webkit-scrollbar-thumb{background:#2d3748;border-radius:2px}
.pp-bd::-webkit-scrollbar-thumb:hover{background:#4a5568}
</style>

function stBadge(stage){
  const s=S.theme==='dark'||S.theme==='pink'?STAGE[stage]:STAGE_WHITE[stage]||STAGE[stage];
  if(!s)return'';
  return`<span style="background:${s.bg};color:${s.color};border:1px solid ${s.color}30;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600">${s.label}</span>`;
}
function stColor(stage){return(STAGE[stage]||STAGE.Lead).color}

let currentView='mob';
function setView(v){
  currentView=v;
  const pc=document.getElementById('pc-panel');
  const mob=document.getElementById('mob-panel');
  const aiSide=document.getElementById('ai-sidebar');
  const mobPrev=document.getElementById('mob-preview-panel');
  const ml=mob?mob.querySelector('.panel-label'):null;

  // 모든 버튼 off
  ['pc','pc-ai','pc-mob'].forEach(k=>{
    const el=document.getElementById('vb-'+k);
    if(el) el.className='v-btn'+(k===v?' on':'');
  });

  if(v==='pc'){
    // PC 전용 — 2단
    pc.classList.remove('hidden');
    if(aiSide)  aiSide.style.display='none';
    if(mobPrev) mobPrev.style.display='none';
    mob.classList.add('hidden');
    mob.classList.remove('full');
  } else if(v==='pc-ai'){
    // PC+AI — 3단 (기본)
    pc.classList.remove('hidden');
    if(aiSide)  { aiSide.style.display='flex'; }
    if(mobPrev) mobPrev.style.display='none';
    mob.classList.add('hidden');
    mob.classList.remove('full');
    // AI 컨텍스트 업데이트
    updateAiContext();
  } else if(v==='pc-mob'){
    // PC+모바일 — 3단
    pc.classList.remove('hidden');
    if(aiSide)  aiSide.style.display='none';
    if(mobPrev) { mobPrev.style.display='flex'; renderMobPreview(); }
    mob.classList.add('hidden');
    mob.classList.remove('full');
  }
  if(ml) ml.style.display='flex';
}
function autoView(){const w=window.innerWidth;if(w>=768){setView('pc-ai');}else{setView('mob');}}
window.addEventListener('resize',()=>{if(!S.userManualView)autoView()});

function setRole(r){
  const prevTab=S.pcTab, prevSub=S.pcSubTab;
  S.role=r;S.mobMore=false;S.mobSelProj=null;S.mobRoleOpen=false;
  // 현재 탭/서브탭이 새 역할에서도 유효한지 확인
  const nav=PC_NAV[r]||PC_NAV.sales;
  const navKeys=nav.filter(Boolean).map(n=>n.key);
  if(!navKeys.includes(prevTab)){
    S.pcTab='dashboard';S.mobTab='dashboard';S.mobTabMode='default';
  } else {
    // 서브탭 유효성 확인
    const navItem=nav.find(n=>n&&n.key===prevTab);
    if(navItem&&navItem.sub&&prevSub&&!navItem.sub.includes(prevSub)){
      S.pcSubTab=navItem.sub.find(s=>s!=='──')||null;
    }
    // 모바일 탭 모드 유지 (영업 탭 안에 있으면 sales 모드 유지)
    if(S.pcTab==='sales') S.mobTabMode='sales';
  }
  // 드롭다운 옵션 활성화
  const labels={
    admin:'전체관리자', sales_manager:'영업팀장', sales:'영업담당자',
    tech_manager:'기술팀장', tech:'기술자',
    accounting_manager:'회계팀장', accounting:'회계담당자',
    manager:'영업관리자', exec:'경영진', dist:'총판', partner:'파트너'
  };
  const lbl=document.getElementById('role-current-label');
  if(lbl) lbl.textContent=labels[r]||r;
  // 드롭다운 닫기
  const menu=document.getElementById('role-dropdown-menu');
  if(menu) menu.classList.remove('open');
  // 드롭다운 활성 표시
  Object.keys(labels).forEach(k=>{
    const el=document.getElementById('rb-'+k);
    if(el) el.className='role-option'+(k===r?' on':'');
  });
  const ri=ROLE_INFO[r]||ROLE_INFO.sales;
  document.querySelector('#pc-panel .panel-label').innerHTML=`💻 PC — ${I(ri.icon,11,'#58a6ff')} ${ri.label}`;
  document.querySelector('#mob-panel .panel-label').innerHTML=`📱 모바일 — ${I(ri.icon,11,'#3fb950')} ${ri.label}`;
  renderPC();renderMob();
}

  const result=AI_RESULTS[type];
  if(!result) return;
  const area=document.getElementById('mob-ai-result');
  const title=document.getElementById('mob-ai-result-title');
  const text=document.getElementById('mob-ai-result-text');
  const action=document.getElementById('mob-ai-action');
  if(!area) return;
  area.style.display='block';
  if(title) title.textContent=result.title+' ('+result.badge+')';
  if(text){ text.textContent=''; let i=0; const lines=result.text.split('');
    const t=setInterval(function(){if(i<lines.length){text.textContent+=lines[i++];}else{clearInterval(t);if(action)action.style.display='flex';}},10);
  }
}

function runAiAnalysis(type){
  const result=AI_RESULTS[type];
  if(!result) return;
  const area=document.getElementById('ai-result-area');
  const title=document.getElementById('ai-result-title');
  const badge=document.getElementById('ai-result-badge');
  const text=document.getElementById('ai-result-text');
  const btns=document.getElementById('ai-action-btns');
  if(!area) return;

  // 크레딧 차감 표시
  if(result.badge!=='무료'){
    const creditVal=document.getElementById('ai-credit-val');
    const creditBar=document.getElementById('ai-credit-bar');
    if(creditVal){
      const cur=parseInt(creditVal.textContent)||680;
      const cost=parseInt(result.badge)||0;
      const newVal=Math.max(0,cur-cost);
      creditVal.textContent=newVal;
      if(creditBar) creditBar.style.width=Math.round(newVal/1000*100)+'%';
    }
  }

  area.style.display='block';
  title.textContent=result.title;
  badge.textContent=result.badge;
  badge.style.cssText='font-size:9px;padding:1px 6px;border-radius:8px;background:'+result.badgeColor+'18;color:'+result.badgeColor+';border:1px solid '+result.badgeColor+'44';
  text.textContent='';
  btns.style.display='none';

  // 스트리밍 효과
  const lines=result.text.split('');
  let i=0;
  text.classList.add('ai-streaming');
  const timer=setInterval(function(){
    if(i<lines.length){
      text.textContent+=lines[i++];
      area.scrollTop=area.scrollHeight;
    } else {
      clearInterval(timer);
      text.classList.remove('ai-streaming');
      btns.style.display='block';
    }
  },12);
}

function runAiQuestion(){
  const input=document.getElementById('ai-question-input');
  if(!input||!input.value.trim()) return;
  const q=input.value.trim();
  input.value='';
  const area=document.getElementById('ai-result-area');
  const title=document.getElementById('ai-result-title');
  const badge=document.getElementById('ai-result-badge');
  const text=document.getElementById('ai-result-text');
  const btns=document.getElementById('ai-action-btns');
  if(!area) return;
  area.style.display='block';
  title.textContent='자유 질문';
  badge.textContent='무료';
  badge.style.cssText='font-size:9px;padding:1px 6px;border-radius:8px;background:rgba(72,199,142,.12);color:#48c78e;border:1px solid rgba(72,199,142,.3)';
  const answer='질문: "'+q+'"\n\n[AI 응답 결과가 여기에 스트리밍됩니다]\n실제 구현 시 Anthropic API 연동 필요\n(OPEN-AI-09 ACRM Agent 개발 명세 확인)';
  text.textContent='';
  btns.style.display='none';
  const lines=answer.split('');
  let i=0;
  text.classList.add('ai-streaming');
  const timer=setInterval(function(){
    if(i<lines.length){ text.textContent+=lines[i++]; }
    else { clearInterval(timer); text.classList.remove('ai-streaming'); btns.style.display='block'; }
  },15);
}

function pcSalesContent(){
  if(S.pcSubTab==='발주관리') return pcOrderContent();
  if(S.pcSubTab==='활동 목록') return pcActivityListContent();
  if(S.pcSubTab==='캘린더') return pcCalendarContent();
  if(S.pcSubTab==='활동 분석') return pcActivityAnalysis();
  if(S.pcSubTab==='파이프라인') return pcPipelineContent();
  if(S.pcSubTab==='PSR 현황') return pcPSRContent();
  if(S.pcSubTab==='Win/Loss') return pcReportWinLoss();
  if(S.pcSubTab==='고객별') return pcSalesByCust();
  if(S.pcSubTab==='제품별') return pcSalesByProduct();
  if(S.pcSubTab==='갱신 예정') return pcSalesRenewal();
  if(S.pcSubTab==='──') S.pcSubTab='내 프로젝트';

  const isMine = S.pcSubTab==='내 프로젝트'||S.pcSubTab==='프로젝트 목록';
  const owners=[...new Set(PROJECTS.map(p=>p.owner))];

  // 필터 적용
  let base = isMine ? PROJECTS.filter(p=>p.owner==='홍길동') : PROJECTS;
  let filtered = base.filter(p=>{
    const sf=!pcSalesSearch||(p.name+p.customer+p.owner).toLowerCase().indexOf(pcSalesSearch.toLowerCase())>=0;
    const of=pcSalesOwner==='전체'||p.owner===pcSalesOwner;
    const stf=S.pcFilter==='전체'||(STAGE[p.stage]||STAGE.Lead).label===S.pcFilter;
    return sf&&of&&stf;
  });

  // 정렬
  filtered = filtered.slice().sort((a,b)=>{
    if(pcSalesSort==='alert') return (b.alert?1:0)-(a.alert?1:0);
    if(pcSalesSort==='prob_desc') return b.prob-a.prob;
    if(pcSalesSort==='amount_desc') return parseInt((b.amount||'0').replace(/,/g,''))-parseInt((a.amount||'0').replace(/,/g,''));
    if(pcSalesSort==='act_asc') return (b.lastActDays||0)-(a.lastActDays||0);
    return 0;
  });

  // 페이지네이션
  const totalCnt=filtered.length;
  const totalPages=Math.max(1,Math.ceil(totalCnt/pcSalesPageSize));
  if(pcSalesPage>totalPages) pcSalesPage=1;
  const startIdx=(pcSalesPage-1)*pcSalesPageSize;
  const pageData=filtered.slice(startIdx,startIdx+pcSalesPageSize);
  const activeFCnt=[pcSalesSearch,pcSalesOwner!=='전체'?1:'',S.pcFilter!=='전체'?1:''].filter(Boolean).length;

  const urgCnt=base.filter(p=>p.alert&&p.alert.l==='red').length;

    ? [{l:'내 진행',v:base.length+'건',sub:'담당 프로젝트',c:'var(--ac)',f:'전체'},
       {l:'목표 달성',v:'64%',sub:'3,200만/5,000만',c:'var(--green)',f:''},
       {l:'긴급 처리',v:urgCnt+'건',sub:'D-7 이내',c:'var(--red)',f:'긴급'},
       {l:'평균 가능성',v:'67%',sub:'수주 예측',c:'var(--orange)',f:''}]
    : [{l:'전체 진행',v:PROJECTS.length+'건',sub:'팀 전체',c:'var(--ac)',f:'전체'},
       {l:'이번달 예상',v:'₩274M',sub:'목표 85%',c:'var(--green)',f:''},
       {l:'즉시 처리',v:urgCnt+'건',sub:'D-7 이내',c:'var(--red)',f:'긴급'},
       {l:'가능성 높음',v:base.filter(p=>p.prob>=70).length+'건',sub:'70% 이상',c:'var(--orange)',f:''}];

  return`
    <div class="pc-stats">
      ${statCards.map(s=>`<div class="pc-stat" style="border-top-color:${s.c};${s.f?'cursor:pointer':''}" ${s.f?`onclick="setPcFilter('${s.f}')"`:''}><div class="pc-stat-lbl">${s.l}</div><div class="pc-stat-val" style="color:${s.c}">${s.v}</div><div class="pc-stat-sub">${s.sub}</div></div>`).join('')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd-sub);flex-shrink:0">
      <div style="position:relative;flex:1;min-width:160px;max-width:260px">
        <span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px">🔍</span>
        <input type="text" value="${pcSalesSearch}" oninput="setPcSalesSearch(this.value)" placeholder="프로젝트명, 고객, 담당자..." style="width:100%;padding:4px 8px 4px 24px;background:var(--bg-raise);border:1px solid var(--bd-sub);border-radius:5px;color:var(--tx);font-size:11px;box-sizing:border-box;font-family:inherit">
      </div>
      ${['전체','발굴','기회','진행','견적','계약중','수주','실패','보류'].map(f=>`<button class="pc-chip ${S.pcFilter===f?'on':''}" onclick="setPcFilter('${f}')">${f}</button>`).join('')}
      ${!isMine?`<select onchange="setPcSalesOwner(this.value)" style="padding:4px 7px;border-radius:5px;border:1px solid var(--bd-sub);background:var(--bg-raise);color:var(--tx);font-size:11px;cursor:pointer">
        <option value="전체">전체 담당자</option>
        ${owners.map(o=>`<option value="${o}"${pcSalesOwner===o?' selected':''}>${o}</option>`).join('')}
      </select>`:''}
      <select onchange="setPcSalesSort(this.value)" style="padding:4px 7px;border-radius:5px;border:1px solid var(--bd-sub);background:var(--bg-raise);color:var(--tx);font-size:11px;cursor:pointer">
        <option value="alert"${pcSalesSort==='alert'?' selected':''}>긴급순</option>
        <option value="prob_desc"${pcSalesSort==='prob_desc'?' selected':''}>가능성↓</option>
        <option value="amount_desc"${pcSalesSort==='amount_desc'?' selected':''}>금액↓</option>
        <option value="act_asc"${pcSalesSort==='act_asc'?' selected':''}>활동 오래된순</option>
      </select>
      ${activeFCnt>0?`<button onclick="resetPcSalesFilter()" style="padding:3px 8px;border-radius:4px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:10px;cursor:pointer">✕ 초기화</button>`:''}
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
        <span style="font-size:11px;color:var(--txm)">${totalCnt}건${activeFCnt>0?' <span style="color:var(--ac)">필터 '+activeFCnt+'개</span>':''}</span>
        <button class="pc-new-btn" style="height:26px;padding:0 10px;font-size:11px" onclick="showPP('proj-new')">${I('plus',11,'#fff')} 새 프로젝트</button>
      </div>
    </div>
    <div style="flex:1;overflow:auto;padding:0 0 0">
      <table class="pc-table" style="min-width:900px">
        <thead><tr>
          <th style="width:20px"></th>
          <th>프로젝트명</th><th>고객</th><th>진행상태</th>
          <th style="text-align:right;cursor:pointer" onclick="setPcSalesSort(pcSalesSort==='amount_desc'?'alert':'amount_desc')">예상금액${pcSalesSort==='amount_desc'?'▼':''}</th>
          <th style="text-align:center;cursor:pointer" onclick="setPcSalesSort(pcSalesSort==='prob_desc'?'alert':'prob_desc')">수주가능성${pcSalesSort==='prob_desc'?'▼':''}</th>
          <th style="text-align:center">예상수주월</th>
          <th style="text-align:center;cursor:pointer" onclick="setPcSalesSort(pcSalesSort==='act_asc'?'alert':'act_asc')">최근활동${pcSalesSort==='act_asc'?'▲':''}</th>
          <th>다음활동</th><th>알림</th>
        </tr></thead>
        <tbody>
          ${pageData.length===0?`<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--txm)">검색 결과 없음</td></tr>`:''}
          ${pageData.map((p,idx)=>{
            const st=STAGE[p.stage]||STAGE.Lead;
            const ac=p.alert?{red:'var(--red)',orange:'var(--orange)',blue:'var(--ac)'}[p.alert.l]:'';
            const pc2=p.prob>=80?'var(--green)':p.prob>=50?'var(--orange)':'var(--red)';
            return`<tr style="cursor:pointer" onclick="openProjDetail(${p.id})">
              <td style="text-align:center;padding-left:10px;color:var(--txm);font-size:10px">${startIdx+idx+1}</td>

        <span style="font-size:11px;color:var(--tx);padding:0 6px">${pcSalesPage} / ${totalPages}p</span>

// 발주관리

// ── 고객별 현황 ───────────────────────────
function pcSalesByCust(){
  var custProj={};
  PROJECTS.forEach(function(p){
    if(!custProj[p.customer]) custProj[p.customer]={total:0,won:0,active:0,amt:0,prob:0,owner:p.owner};
    var c=custProj[p.customer];
    c.total++;
    if(p.stage==='Closed-Won') c.won++;
    else if(p.stage!=='Closed-Lost'&&p.stage!=='Closed-Hold') c.active++;
    c.amt+=parseInt((p.amount||'0').replace(/,/g,''));
    c.prob+=p.prob;
  });
  function fmtAmt(n){return n>=100000000?(Math.floor(n/10000000)/10+'억'):n>=10000?(Math.floor(n/10000)+'만'):'0';}
  var custs=Object.keys(custProj).sort((a,b)=>custProj[b].amt-custProj[a].amt);
  var rows=custs.map(function(name){
    var d=custProj[name]; var avgProb=d.total?Math.round(d.prob/d.total):0;
    var pc=avgProb>=70?'var(--green)':avgProb>=40?'var(--orange)':'var(--red)';
    return`<tr style="cursor:pointer" onclick="setPcTab('customers');custSelId=${CUSTOMERS.find(c=>c.name===name)?.id||1};custTab='영업관리';renderPC()">
      <td style="font-weight:600;color:var(--tx)">${name}</td>
      <td style="text-align:center;color:var(--ac);font-weight:600">${d.total}건</td>
      <td style="text-align:center;color:var(--orange)">${d.active}건</td>
      <td style="text-align:center;color:var(--green)">${d.won}건</td>
      <td style="text-align:right;font-family:monospace;color:var(--tx)">₩${fmtAmt(d.amt)}</td>
      <td style="text-align:center;color:${pc};font-weight:700">${avgProb}%</td>
      <td style="color:var(--txm);font-size:11px">${d.owner}</td>
      <td><button onclick="event.stopPropagation();setPcTab('customers');custSelId=${CUSTOMERS.find(c=>c.name===name)?.id||1};custTab='영업관리';renderPC()" style="font-size:10px;color:var(--ac);background:var(--ac-glow);border:1px solid var(--ac);border-radius:4px;padding:2px 7px;cursor:pointer">상세</button></td>
    </tr>`;
  }).join('');
  return`<div class="pc-stats">
    <div class="pc-stat" style="border-top-color:var(--ac)"><div class="pc-stat-lbl">고객사 수</div><div class="pc-stat-val" style="color:var(--ac)">${custs.length}사</div></div>
    <div class="pc-stat" style="border-top-color:var(--orange)"><div class="pc-stat-lbl">전체 프로젝트</div><div class="pc-stat-val" style="color:var(--orange)">${PROJECTS.length}건</div></div>
    <div class="pc-stat" style="border-top-color:var(--green)"><div class="pc-stat-lbl">수주 완료</div><div class="pc-stat-val" style="color:var(--green)">${PROJECTS.filter(p=>p.stage==='Closed-Won').length}건</div></div>
  </div>
  <div style="flex:1;overflow:auto;padding:0 0 14px">
    <table class="pc-table" style="width:100%">
      <thead><tr><th>고객사</th><th>전체</th><th>진행중</th><th>수주</th><th style="text-align:right">총 금액</th><th>평균가능성</th><th>담당자</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ── 제품별 현황 ───────────────────────────
function pcSalesByProduct(){
  // 제품 라인업 데이터 집계 (실제는 product lineup에서)
  var vendors=['시큐아이','이스트소프트','펜타시큐리티','웨어밸리','안랩','워터월시스템즈'];
  var vendorData=vendors.map(function(v,i){
    var cnt=Math.floor(Math.random()*8)+1;
    var amt=(cnt*(Math.random()*5000+1000)|0)*10000;
    function fmtAmt(n){return n>=100000000?(Math.floor(n/10000000)/10+'억'):n>=10000?(Math.floor(n/10000)+'만'):'0';}
    return{v,cnt,amt,fmtAmt};
  });
  function fmtAmt(n){return n>=100000000?(Math.floor(n/10000000)/10+'억'):n>=10000?(Math.floor(n/10000)+'만'):'0';}
  var totalAmt=vendorData.reduce((s,d)=>s+d.amt,0);
  var rows=vendorData.map(function(d){
    var share=Math.round(d.amt/totalAmt*100);
    var barColor=share>=25?'var(--green)':share>=15?'var(--ac)':'var(--txm)';
    return`<tr>
      <td style="font-weight:600;color:var(--tx)">${d.v}</td>
      <td style="text-align:center;color:var(--ac);font-weight:600">${d.cnt}건</td>
      <td style="text-align:right;font-family:monospace">₩${fmtAmt(d.amt)}</td>
      <td style="text-align:center;color:${barColor};font-weight:700">${share}%</td>
      <td style="width:200px"><div style="display:flex;align-items:center;gap:6px">
        <div style="flex:1;height:6px;background:var(--bg-over);border-radius:3px">
          <div style="height:100%;width:${share}%;background:${barColor};border-radius:3px"></div>
        </div>
      </div></td>
    </tr>`;
  }).join('');
  return`<div class="pc-stats">
    <div class="pc-stat" style="border-top-color:var(--ac)"><div class="pc-stat-lbl">취급 벤더</div><div class="pc-stat-val" style="color:var(--ac)">${vendors.length}사</div><div class="pc-stat-sub">6개 파트너</div></div>
    <div class="pc-stat" style="border-top-color:var(--green)"><div class="pc-stat-lbl">전체 공급</div><div class="pc-stat-val" style="color:var(--green)">${fmtAmt(totalAmt)}</div><div class="pc-stat-sub">누적</div></div>
  </div>
  <div style="flex:1;overflow:auto;padding:0 0 14px">
    <table class="pc-table" style="width:100%">
      <thead><tr><th>벤더/제품</th><th>프로젝트수</th><th style="text-align:right">공급 금액</th><th>비중</th><th>점유 바</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// PC 고객관리 — Safari 안전 문자열 방식

function ddayColor(d){
  if(!d) return 'var(--txm)';
  if(d<=3) return 'var(--red)';
  if(d<=30) return 'var(--orange)';
  return 'var(--yellow)';
}
function ddayBadge(d){
  if(!d) return '';
  var c=ddayColor(d);
  return '<span class="cust-dday" style="background:'+c+'22;color:'+c+'">D-'+d+'</span>';
}
function gradeSpan(g){
  return '<span style="font-size:10px;font-weight:700;color:'+( GRADE_COLOR[g]||'var(--txm)')+'">'+( GRADE_LABEL[g]||g)+'</span>';
}

function mgmtSpan(mgmt){
  var cfg={
    '통합관리':{c:'var(--ac)',b:'rgba(100,160,255,.15)'},
    '소속개별':{c:'#a064ff',b:'rgba(160,100,255,.15)'},
    '개별관리':{c:'var(--txm)',b:'var(--bg-raise)'},
  };
  var s=cfg[mgmt]||cfg['개별관리'];
  return '<span style="font-size:10px;background:'+s.b+';border:1px solid '+s.c+';color:'+s.c+';padding:1px 6px;border-radius:3px">'+mgmt+'</span>';
}

function setCustSort(col){
  if(custSortCol===col) custSortAsc=!custSortAsc;
  else{custSortCol=col;custSortAsc=true;}
  renderPC();
}

function pcCustomers(){
  var owners=[...new Set(CUSTOMERS.map(function(c){return c.owner;}))];
  var regions=[...new Set(CUSTOMERS.map(function(c){return c.region;}))];

  // 필터 적용
  var filtered=CUSTOMERS.filter(function(c){
    var sf=!custSearchText||(c.name+(c.biz||'')).toLowerCase().indexOf(custSearchText.toLowerCase())>=0;
    var typeFilters=['기관','기업','교육기관','병원'];
    var cf=custFilter==='전체'
      ||(custFilter==='긴급'&&c.dday&&c.dday<=7)
      ||(custFilter==='VIP'&&c.grade==='VIP')
      ||(typeFilters.indexOf(custFilter)>=0&&c.type===custFilter);
    var of=custFilterOwner==='전체'||c.owner===custFilterOwner;
    var mf=custFilterMgmt==='전체'||c.mgmt===custFilterMgmt;
    var tf=true; // 고객유형 드롭다운 제거 → 탭으로 통합
    var rf=custFilterRegion==='전체'||c.region===custFilterRegion;
    var statusMap={'활동고객':'ACTIVE','휴면고객':'INACTIVE','보류고객':'SUSPENDED'};
    var stf=custFilterStatus==='전체'||c.status===(statusMap[custFilterStatus]||custFilterStatus);
    return sf&&cf&&of&&mf&&tf&&rf&&stf;
  });

  // 정렬 적용
  if(custSortCol){
    filtered=filtered.slice().sort(function(a,b){
      var av='',bv='';
      if(custSortCol==='name'){av=a.name;bv=b.name;}
      else if(custSortCol==='type'){av=a.type;bv=b.type;}
      else if(custSortCol==='region'){av=a.region;bv=b.region;}
      else if(custSortCol==='grade'){var gmap={VIP:0,STANDARD:1,BASIC:2};av=gmap[a.grade]||9;bv=gmap[b.grade]||9;}
      else if(custSortCol==='dday'){av=a.dday||999;bv=b.dday||999;}
      else if(custSortCol==='owner'){av=a.owner;bv=b.owner;}
      else if(custSortCol==='lastact'){av=a.lastAct==='오늘'?0:parseInt(a.lastAct)||99;bv=b.lastAct==='오늘'?0:parseInt(b.lastAct)||99;}
      if(typeof av==='string') return custSortAsc?(av>bv?1:av<bv?-1:0):(av<bv?1:av>bv?-1:0);
      return custSortAsc?av-bv:bv-av;
    });
  }

  var sel=null;
  for(var i=0;i<CUSTOMERS.length;i++){if(CUSTOMERS[i].id===custSelId){sel=CUSTOMERS[i];break;}}
  var mini=null;
  if(!sel){for(var i=0;i<CUSTOMERS.length;i++){if(CUSTOMERS[i].id===custHoverId){mini=CUSTOMERS[i];break;}}}

  var vipCnt=CUSTOMERS.filter(function(c){return c.grade==='VIP';}).length;
  var urgCnt=CUSTOMERS.filter(function(c){return c.dday&&c.dday<=7;}).length;
  var activeFCnt=[custSearchText,custFilter!=='전체'?1:'',custFilterOwner!=='전체'?1:'',custFilterMgmt!=='전체'?1:'',custFilterRegion!=='전체'?1:''].filter(Boolean).length;

  var hasRight=!!sel;
  var listW=hasRight?(custSavedListW?custSavedListW+'px':'640px'):'100%';
  var leftPanel='<div id="cust-list-panel" style="width:'+listW+';min-width:'+listW+';max-width:'+listW+';display:flex;flex-direction:column;overflow:hidden;border-right:'+(sel||mini?'1px solid var(--bd-sub)':'none')+'">';
  leftPanel+='<div style="flex-shrink:0">';
  // ── 통계카드
  leftPanel+='<div style="display:flex;gap:7px;padding:10px 12px 8px">';
  [{l:'전체 고객',v:CUSTOMERS.length+'사',c:'var(--ac)',f:'전체'},
   {l:'VIP',v:vipCnt+'사',c:'var(--yellow)',f:'VIP'},
   {l:'긴급(D-7)',v:urgCnt+'건',c:'var(--red)',f:'긴급'},
   {l:'활성 프로젝트',v:'18건',c:'var(--green)',f:'전체'}]
  .forEach(function(ss){
    leftPanel+='<div class="pc-stat" style="border-top-color:'+ss.c+';cursor:pointer;flex:1" onclick="setCustFilter(\''+ss.f+'\')">'      +'<div class="pc-stat-lbl">'+ss.l+'</div><div class="pc-stat-val" style="color:'+ss.c+'">'+ss.v+'</div></div>';
  });
  leftPanel+='</div>';
  // ── 고객유형 탭
  leftPanel+='<div style="display:flex;gap:5px;align-items:center;padding:0 12px 8px;border-bottom:1px solid var(--bd-sub)">';
  ['전체','기관','기업','교육기관','병원','VIP','긴급'].forEach(function(t){
    leftPanel+='<button class="pc-chip'+(custFilter===t?' on':'')+'" onclick="setCustFilter(\''+t+'\')">' +t+'</button>';
  });
  leftPanel+='</div>';
  // ── 검색창 + 드롭다운 (table 레이아웃 — 끝선 정렬)
  var selH='height:26px;box-sizing:border-box;padding:0 8px;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;';
  var btnH='height:26px;box-sizing:border-box;padding:0 12px;font-size:10px;white-space:nowrap;width:120px;display:inline-flex;align-items:center;justify-content:center;gap:4px;';
  leftPanel+='<div style="display:table;width:100%;border-spacing:0;padding:10px 12px 0">';
  leftPanel+='<div style="display:table-row">';
  leftPanel+='<div style="display:table-cell;padding-bottom:6px;padding-right:8px">';
  leftPanel+='<div class="pc-search" style="height:26px;box-sizing:border-box;padding:0 10px;width:100%">'
    +I('search',11,'var(--txm)')
    +'<input type="text" value="'+(custSearchText||'')+'" oninput="setCustSearchText(this.value)" placeholder="고객명 / 사업자번호 검색..."/></div>';
  leftPanel+='</div>';
  leftPanel+='<div style="display:table-cell;padding-bottom:6px;width:120px;vertical-align:middle">';
  leftPanel+='<button class="pc-new-btn" onclick="showPP(\'narajangteo\')" style="'+btnH+'">'
    +I('search',10,'#fff')+' 신규 고객사 검색</button>';
  leftPanel+='</div></div>';
  leftPanel+='<div style="display:table-row">';
  leftPanel+='<div style="display:table-cell;padding-bottom:8px;padding-right:8px;vertical-align:middle">';
  var STATUS_LABEL={'전체':'전체','활동고객':'활동고객','휴면고객':'휴면고객','보류고객':'보류고객'};
  leftPanel+='<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">';
  [
    {label:'담당영업자',val:custFilterOwner,fn:'setCustFilterOwner',opts:['전체'].concat(owners)},
    {label:'관리유형',val:custFilterMgmt,fn:'setCustFilterMgmt',opts:['전체','통합관리','개별관리','소속개별']},
    {label:'지역',val:custFilterRegion,fn:'setCustFilterRegion',opts:['전체'].concat(regions)},
    {label:'상태',val:custFilterStatus,fn:'setCustFilterStatus',opts:['전체','활동고객','휴면고객','보류고객']},
  ].forEach(function(f){
    var isActive=f.val!=='전체';
    leftPanel+='<select onchange="'+f.fn+'(this.value)" style="'+selH+'border:1px solid '+(isActive?'var(--ac)':'rgba(255,255,255,0.12)')+';background:'+(isActive?'var(--ac-glow)':'var(--bg-raise)')+';color:'+(isActive?'var(--ac)':'var(--txm)')+'">';
    f.opts.forEach(function(o){
      var optLabel=(o==='전체'&&!isActive)?f.label:o;
      leftPanel+='<option value="'+o+'"'+(f.val===o?' selected':'')+'>'+optLabel+'</option>';
    });
    leftPanel+='</select>';
  });
  if(activeFCnt>0){
    leftPanel+='<button onclick="resetCustFilters()" style="height:24px;padding:0 8px;border-radius:5px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:10px;cursor:pointer">✕</button>';
  }
  leftPanel+='<span style="font-size:10px;color:var(--txm);margin-left:2px">'+filtered.length+'/'+CUSTOMERS.length+'건</span>';
  leftPanel+='</div></div>';
  leftPanel+='<div style="display:table-cell;width:120px;vertical-align:middle">';
  leftPanel+='<button class="pc-new-btn" onclick="showPP(\'cust-new\')" style="'+btnH+'">'
    +I('plus',10,'#fff')+' 신규 등록</button>';
  leftPanel+='</div></div></div>';
  leftPanel+='<div style="border-bottom:1px solid var(--bd-sub);margin:0 12px 10px"></div>';
  leftPanel+='</div>';
  // 테이블
  var rows='';
  for(var ri=0;ri<filtered.length;ri++){
    var c=filtered[ri];
    var dc=ddayColor(c.dday);
    var selCls=c.id===custSelId?' sel':c.id===custHoverId?' sel':'';
    var ddayTd=c.dday?('<span class="cust-dday" style="background:'+dc+'22;color:'+dc+'">D-'+c.dday+'</span>'):'<span style="color:var(--txm)">-</span>';
    var tagHtml='';
    for(var ti=0;ti<Math.min(c.tags.length,2);ti++){tagHtml+='<span class="cust-tag">'+c.tags[ti]+'</span>';}
    rows+='<tr class="'+selCls+'" onclick="setCustSel('+c.id+')" style="cursor:pointer">';
    rows+='<td style="width:16px"><div class="cust-grade-dot" style="background:'+(GRADE_COLOR[c.grade]||'var(--txm)')+'"></div></td>';
    rows+='<td><div style="font-size:11px;font-weight:600;color:var(--tx)">'+c.name+'</div><div style="margin-top:2px">'+tagHtml+'</div></td>';
    rows+='<td style="width:52px"><span style="font-size:10px;color:'+(TYPE_COLOR[c.type]||'var(--ac)')+'">'+c.type+'</span></td>';
    rows+='<td style="width:50px;font-size:11px;color:var(--tx2)">'+c.region+'</td>';
    rows+='<td style="width:44px">'+gradeSpan(c.grade)+'</td>';
    rows+='<td style="width:62px">'+ddayTd+'</td>';
    rows+='<td style="width:64px;font-size:11px;color:var(--tx2)">'+c.owner+'</td>';
    rows+='<td style="width:52px;font-size:11px;color:var(--ac);text-align:right">'+c.projects+'건</td>';
    rows+='<td style="width:80px;font-size:11px;color:var(--txm)">'+c.lastAct+'</td>';
    rows+='</tr>';
  }
  var thFn=function(col,label){
    var isActive=custSortCol===col;
    var arrow=isActive?(custSortAsc?'▲':'▼'):'↕';
    var ac=isActive?'var(--ac)':'rgba(255,255,255,0.2)';
    return'<th onclick="setCustSort(\''+col+'\')" style="cursor:pointer;user-select:none;white-space:nowrap">'+label+'<span style="color:'+ac+';font-size:9px;margin-left:2px">'+arrow+'</span></th>';
  };
  leftPanel+='<div style="flex:1;overflow-y:auto;padding-top:8px"><table class="pc-table" style="width:100%">';
  leftPanel+='<thead><tr><th style="width:16px"></th>'+thFn('name','고객명')+thFn('type','유형')+thFn('region','지역')+thFn('grade','등급')+thFn('dday','D-day')+thFn('owner','담당')+'<th style="text-align:right;white-space:nowrap">프로젝트</th>'+thFn('lastact','최근활동')+'</tr></thead>';
  leftPanel+='<tbody>'+rows+'</tbody></table></div>';
  leftPanel+='<div style="padding:3px 12px;border-top:1px solid var(--bd-sub);font-size:9px;color:var(--txm);flex-shrink:0;display:flex;justify-content:space-between"><span>클릭: 상세보기</span><span style="color:var(--ac)">'+filtered.length+'/'+CUSTOMERS.length+'건</span></div>';
  leftPanel+='</div>';

  // 우측: 단일클릭 미니패널 or 상세패널
  var rightPanel='';
  if(sel){
    rightPanel=pcCustDetail(sel);
  } else if(mini){
    rightPanel=pcCustMiniPanel(mini);
  }

  var html='<div id="cust-split" style="flex:1;display:flex;overflow:hidden">'+leftPanel;
  if(sel){
    html+='<div id="cust-resizer" style="width:6px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center" onmousedown="startCustResize(event)" onmouseover="this.querySelector(\'span\').style.background=\'var(--ac)\'" onmouseout="this.querySelector(\'span\').style.background=\'rgba(255,255,255,0.12)\'">'
      +'<span style="width:1px;height:100%;background:rgba(255,255,255,0.12);transition:background .2s;pointer-events:none"></span></div>';
  }
  html+=rightPanel+'</div>';

  return html;
}

// 단일클릭 미니패널 (우측)

  html+='</div></div>';
  html+='<div style="font-size:10px;color:var(--txm)">'+c.region+' · '+c.type+' · 담당: <strong style="color:var(--ac)">'+c.owner+'</strong></div>';
  html+='<div style="margin-top:8px"><button class="pc-btn-p" style="width:100%" onclick="setCustSel('+c.id+');custHoverId=null">상세 전체 보기 →</button></div>';

function startCustResize(e){
  e.preventDefault();
  var listPanel=document.getElementById('cust-list-panel');
  var split=document.getElementById('cust-split');
  if(!listPanel||!split) return;
  var startX=e.clientX, startW=listPanel.offsetWidth;
  var totalW=split.offsetWidth;
  function onMove(ev){
    var newW=Math.max(500,Math.min(totalW-500,startW+(ev.clientX-startX)));
    listPanel.style.width=newW+'px';
    listPanel.style.minWidth=newW+'px';
    listPanel.style.maxWidth=newW+'px';
  }
  function onUp(){
    custSavedListW=listPanel.offsetWidth;
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function pcCustSales(c){
  var allProj=PROJECTS.filter(function(p){return p.customer===c.name;});
  var wonCnt=allProj.filter(function(p){return p.stage==='Closed-Won';}).length;
  var activeCnt=allProj.filter(function(p){return p.stage!=='Closed-Won'&&p.stage!=='Closed-Lost'&&p.stage!=='Closed-Hold';}).length;
  var failCnt=allProj.filter(function(p){return p.stage==='Closed-Lost'||p.stage==='Closed-Hold';}).length;

  // 통계 카드 (클릭 필터)
  var statItems=[
    {k:'전체',   v:allProj.length+'건', c:'var(--ac)'},
    {k:'수주완료',v:wonCnt+'건',        c:'var(--green)'},
    {k:'진행중',  v:activeCnt+'건',     c:'var(--orange)'},
    {k:'실패/보류',v:failCnt+'건',      c:'var(--red)'},
  ];
  var html='<div style="display:flex;gap:6px;margin-bottom:12px">';
  for(var si=0;si<statItems.length;si++){
    var ss=statItems[si];
    var fon=pcSalesFilter===ss.k;
    html+='<div class="pc-stat" style="border-top-color:'+ss.c+';cursor:pointer;flex:1;'+(fon?'box-shadow:0 0 0 1.5px '+ss.c+';':'')+'" onclick="setPcSalesFilter(\''+ss.k+'\')">';
    html+='<div class="pc-stat-lbl">'+ss.k+'</div>';
    html+='<div class="pc-stat-val" style="color:'+ss.c+';font-size:14px">'+ss.v+'</div>';
    html+='</div>';
  }
  html+='</div>';

  // 필터링
  var filtered=allProj.filter(function(p){
    if(pcSalesFilter==='수주완료') return p.stage==='Closed-Won';
    if(pcSalesFilter==='진행중')   return p.stage!=='Closed-Won'&&p.stage!=='Closed-Lost'&&p.stage!=='Closed-Hold';
    if(pcSalesFilter==='실패/보류') return p.stage==='Closed-Lost'||p.stage==='Closed-Hold';
    return true;
  });

  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">';
  html+='<span style="font-size:10px;color:var(--txm)">'+filtered.length+'건</span>';
  html+='<button class="pc-new-btn" onclick="showPP(\'proj-new\')">+ 새 프로젝트</button>';
  html+='</div>';

  if(filtered.length===0){
    html+='<div style="text-align:center;padding:30px;color:var(--txm);font-size:12px">해당 프로젝트가 없습니다</div>';
  } else {
    for(var pi=0;pi<filtered.length;pi++){
      var p=filtered[pi];
      var st=STAGE[p.stage]||STAGE.Lead;
      var pc2=p.prob>=80?'var(--green)':p.prob>=50?'var(--orange)':'var(--red)';
      html+='<div style="border:1px solid var(--bd-sub);border-radius:7px;padding:10px 12px;margin-bottom:8px;background:var(--bg-raise);cursor:pointer;border-left:3px solid '+st.color+'" onclick="setPcTabSales('+p.id+')">';
      html+='<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">';
      html+='<span style="font-size:11px;font-weight:600;color:var(--tx);flex:1">'+p.name+'</span>';
      html+='<span style="background:'+st.bg+';color:'+st.color+';border:1px solid '+st.color+'30;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:600">'+st.label+'</span>';
      html+='</div>';
      html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:10px">';
      html+='<span style="color:var(--txm)">&#8361;'+p.amount+'</span>';
      html+='<span style="color:'+pc2+';font-weight:600">수주가능 '+p.prob+'%</span>';
      html+='<span style="color:var(--txm)">'+p.lastAct+'</span>';
      html+='</div></div>';
    }
  }
  return html;
}

function pcCustInvoice(c){
  var items=[
    {proj:'강동구청 보안솔루션',date:'2025-03-28',amount:'49,500,000',vat:'4,500,000',total:'54,000,000',status:'발행완료'},

  ];
  var totalAmt=items.reduce(function(s,i){return s+parseInt(i.amount.replace(/,/g,''));},0);
  function fmtAmt(n){return n>=100000000?(Math.floor(n/10000000)/10+'억'):n>=10000?(Math.floor(n/10000)+'만'):'0';}
  var html='<div style="display:flex;gap:8px;margin-bottom:14px">';
